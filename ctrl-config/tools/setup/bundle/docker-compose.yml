---
version: '3'

services:
  controller:
    image: $CONTROLLER_IMAGE
    container_name: controller
    restart: always

    ports:
      - 6000:5000

    environment:
      - SESSION
      - PTAH_PASSWORD
      - PP_PASSWORD
      - PP_USER
      - PP_INBOX
      - AUTO_PULL

  scheduler:
    
    image: $SCHEDULER_IMAGE

    container_name: scheduler

    restart: always

    environment:
      - SESSION
      - DISPATCHERS
      - SITE_ID
      - ANTENNA_IDS
      - MODE
      - SCHEDULE_AHEAD
      - QUERY_FREQUENCY
      
      

    
    
      

    

    

    
  
