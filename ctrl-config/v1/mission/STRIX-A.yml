---
type: mission
config: STRIX-A
load_config: False
run_mode: production
autosign: True
autosign_level: 0
#kmon_autosign: True
#kmon_level: 0
customer: SYNSPECTIVE
constellation: SYNSPECTIVE
series: SYNSPECTIVE
## Needed for autosign matching
watch: False ## Sends event log for pass
watchers:
  - bjarne@ksat.no

##
metadata:

  signal_detection_methods:
      
    S:
      - specnet_first_aqc
      - specnet_first_str
      - specnet_stability
      - specnet_mean

    X:
      - qmr_first_aqc
      - qmr_first_str
      - qmr_stability
      - qmr_mean

  data_collection_methods:
    S: ctx_storage
    x: qdra_raw

  frequencies:
    S: 2276000000  
    X: 8300000000
    SU: 2086900000

  polarity:
    S: RHCP
    X: RHCP
    

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:

## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - U
      - S

    whitelist:
      - 10.146.10.0/24
      - 10.146.20.0/24

    services:
      - ctx_tcp

  ctx:
    tags:
      - U
      - S

    reset: True
    
  specnet:
    tags:
      - U
      - S

  qradio:
    tags:
      - U
      - S

  qfep:
    tags:
      - U
      - S

    record: True
       
  qmr:
    set_dynamic_host: True
    
    tags:
      - X

  qdra_inst1:
    tags:
      - X
      
    record:
    
      streams:
        - raw
    
    transfer: False
    stream: False
    


  


