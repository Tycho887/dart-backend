---
type: mission
config: ALE_1
load_config: True
run_mode: production
autosign: True
autosign_level: 0
kmon_autosign: True
kmon_level: 0
customer: ALE
constellation: ALE
watch: True ## Sends event log for pass
watchers:
  - bjarne@ksat.no

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:

## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - U
      - S

    whitelist:
      - 192.168.0.0/24
      - 192.168.10.0/24
      - 192.146.238.172

    services:
      - ctx_tcp
      - qradio_tcp
      - qradio_http

  ctx:
    tags:
      - U
      - S

    storage:
      record: True
      filename_flavour: legacy
       
    reset: True

  specnet:
    tags:
      - U
      - S

  qradio:
    tags:
      - U
      - S

  qfep:
    tags:
      - U
      - S
      



  


