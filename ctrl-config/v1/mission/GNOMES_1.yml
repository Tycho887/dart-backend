---
type: mission
config: GNOMES_1
customer: PLANETIQ ## Needed for autosign matching, will be depreciated
constellation: PLANETIQ

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:

## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - U
      - S

    whitelist:
      - 192.168.132.0/24
      - 192.146.238.242
      - 192.146.238.172

    services:
      - ctx_tcp
      - qradio_tcp
      - qradio_http
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - U
      - S

  qradio:
    config: GNOMES_1_mode0
    tags:
      - U
      - S

  qfep:
    tags:
      - U
      - S

    record:
        transfer: False
          
  qmr:
    tags:
      - X

  qdra_inst1:
    tags:      
      - X
      
    record:
      streams:
        - raw

    transfer: False
    stream: True




  


