---
type: mission
config: ICEYE_X3
load_config: True
run_mode: production
autosign: True
autosign_level: 0
#kmon_autosign: True
#kmon_level: 0
customer: ICEYE
constellation: ICEYE
series: YORKSPACE
## Needed for autosign matching
watch: False ## Sends event log for pass
watchers:
  - bjarne@ksat.no

##
metadata:

  signal_detection_methods:
      
    S:
      - specnet_first_aqc
      - specnet_first_str
      - specnet_stability
      - specnet_mean

    X:
      - qmr_first_aqc
      - qmr_first_str
      - qmr_stability
      - qmr_mean

  data_collection_methods:
    S: ctx_storage
    x: qdra_raw

  frequencies:
    S: 2276000000  
    X: 8300000000
    SU: 2086900000

  polarity:
    S: RHCP
    X: RHCP
    
summary: SmallSat SAR constellation based in Finland. ICEYE-X3 is a low inclination satellite (40° inclination) operated by York Space. part of ICEYE constellation. Uses API for reservation. Contracted for 16 passes per day on mid-lat stations.
contacts:
  ksat:
    - name: Krister Konst
      role: Project Manager
      email: krister@ksat.no
    - name: Birk Engegård
      role: System Engineer
      email: birke@ksat.no
  customer:
      - name: Johnny Finnholm
        role: Project Manager
        email: johnny.finnholm@iceye.fi
      - name: Marcus Granér
        role: Technical Contact
        email: marcus.graner@iceye.fi
      - name: ICEYE Operations
        role: Operations Centre
        email: operations@iceye.fi
      - name: Steven Pennington
        role: York Space Contact
        email: steve.pennington@yorkspacesystems.com

  

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:

## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - U
      - S

    whitelist:
      - 10.100.4.1
      - 192.168.59.1
      - 192.168.60.4
      - 192.146.238.172

    services:
      - ctx_tcp
      - qradio_http
      - qmr_http

  ctx:
    tags:
      - U
      - S

    storage:
      record: True
      filename_flavour: std
            
    reset: True

  specnet:
    tags:
      - U
      - S

  qradio:
    tags:
      - U
      - S

  qfep:
    tags:
      - U
      - S

    record:

      transfer:
        ftp:
          host: 192.146.239.4
          port: 22
          user: lite
          home: /customers/FTP/YORKSPACE
          
        transfer: True      
    

  qmr:
    set_dynamic_host: True
    
    tags:
      - X

  qdra_inst1:
    tags:
      - X
      
    record:

      test_recording_exists:
        disabled: True
    
      streams:
        - raw

      transfer:
        ftp:
          host: 192.146.239.4
          port: 22
          user: lite
          home: /customers/FTP/YORKSPACE
    
    transfer: True
    stream: False

  


