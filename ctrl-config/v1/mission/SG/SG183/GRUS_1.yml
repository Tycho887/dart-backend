---
type: mission
config: GRUS_1
run_mode: production
customer: AXELSPACE
constellation: GRUS

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:
## Notes: Currently only controls specnet, qradio and qfep
## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S


  proxy:
    tags:
      - U
      - S

    whitelist:
      - 10.100.25.0/24
      - 10.100.23.0/24

    services:
      - qradio_tcp
        
  specnet:
    tags:
      - U
      - S

  qradio:
    tags:
      - U
      - S

  qfep:
    tags:
      - U
      - S

  qmr:
    tags:
      - X

    set_dynamic_host: True
    
  qdra_inst1:
    tags:
      - X

    record:
      streams:
        - raw

      transfer:
        ftp:
          host: 172.23.99.11
          port: 2222
          user: lite
          home: /data/customers/axelspace/
    
    transfer: True


        


  


