    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - S

    whitelist:
      - 10.103.251.0/24

    services:
      - ctx_tcp
      - qradio_tcp

  ctx:
    tags:
      - S

    storage:
      record: True
      filename_flavour: std
                
    reset: True

  specnet:
    tags:
      - S

  qradio:
    tags:
      - S

  qfep:
    tags:
      - S
      



  


