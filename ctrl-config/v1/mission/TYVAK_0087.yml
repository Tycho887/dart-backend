---
type: mission
config: TYVAK_0087
hpa_watchdog: False
load_config: True
run_mode: production
autosign: True
autosign_level: 0
kmon_autosign: True
kmon_level: 0
customer: TYVAK
constellation: TYVAK
series: 80
watch: False ## Sends event log for pass
watchers:
  - bjarne@ksat.no

metadata:
  data_collection_methods:
    X: ctx_storage
    
  frequencies:
    S: 
    X: 8050000000
    SU: 

  polarity:
    X: RHCP

## Special keys:
## type: mission
## config: global config name, otherwise file name is used
## run_mode: used to discard certain functions when running, if none all is run

services:

## Special keys:
## tags: list of tags, runs all if none
## functions: list of functions to be run, runs all if none
## modes: list of modes, runs all if none
## config: override global config
## object_id: looks for object
#  proxy:
    ## Tags are specific
#    tags:
#      - U
#      - S

  proxy:
    tags:
      - U
      - S
      - X

    whitelist:
      - 192.168.37.0/24
      - 10.103.222.0/24
      - 192.146.238.172

    services:
      - ctx_tcp

  ctx:
    tags:
      - U
      - S
      - X

    storage:
      record: True
      filename_flavour: legacy

    transfer:
      ftp:
        host: 192.146.239.4
        port: 22
        user: lite
        home: /customers/FTP/TYVAK
                
    reset: True

    tests:
      ctx_recording:
        level: 5
        
    
  specnet:
    tags:
      - U
      - S
      - X

    signal_detect:
      ## Args:
      ## threshold::float, default 5 dB
      ## samples::int, default 10
      ## interval::float, default 1 second      
      threshold: 10


  qradio:
    tags:
      - U
      - S
      - X

  qfep:
    tags:
      - U
      - S
      - X
      



  


