---
config: configName
acu_config: acuConfigName # without the _acu.conf part
  
services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 10.100.4.1
      - 192.146.238.0/24

    services:
      - ctx_tcp
      - qradio_tcp
      - qdra_tcp
      - monitor_tcp
      - qradio_http
      - qmr_http
      - spectrum_http
      - mc_http

  ctx:
    # This is only needed for ctx-recording, transfer and reset at LOS.
    
    tags:
      - SU
      - SD

    idtype: legacy
    id_flavour: legacy

    transfer:
      backend: ftp3
      home: /customers/FTP/TYVAK

    reset: True


  specnet:
    tags:
      - SU
      - SD

    autoconf:
      enabled: True

      spectral_class_dl: s_rhcp # Default: s_rhcp
      spectral_class_ul: s_rhcp # Default: s_rhcp

      system_specific:
        LB1:
          inputFrequency: 2201
          system_bandwidth: '22.0'

        JJ1:
          force_attenuation: 12

        BB1:
          enabled: False

  qradio:
    tags:
      - SU
      - SD

     config: qradioConfigName

  qfep:
    tags:
      - SD
      - SU

    tlm_record: True # Default: True

    transfer:
      backend: ftp3
      home: /customers/FTP/BIRKSAT

  qmr:
    tags:
      - XD

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1100
      rf0StreamOffset: 25
      rf0StreamBW: 200

  wb_specnet2:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1100
      rf0StreamOffset: 25
      rf0StreamBW: 200

  qrx:
    tags:
      - XD

  qdra_inst1:
    tags:
      - XD
      
    record:
      streams: [1,2,3,4,5]


    ## NOTE: using "transfer" and "aws_s3_transfer"
    ## simultanously may not yield expected results.
    ## We generally support one or the other
    
    transfer:
      backend: ftp3
      home: /customers/FTP/BIRKSAT
      stream_raw: False # Default: True. Whether or not StreamRaw should be added to path

    aws_s3_transfer:
      backend: aws_s3 # Hook in system-file with web_proxy info
      bucket_name: birksat-us-east-1
      profile: birksat
      prefix: prod/DATA # Default: DATA. If None path will be contact_id/payload/ etc
      concurrency: 3 # Default: 1
      stream_raw: True # Default: False
      accelerate: False # default: False
      s3_endpoint_url: https://storage.googleapis.com # Default: None. Use this if not AWS S3
      extension: .frame # Default: None
      post_transfer_delete: True # Default: True
      inst_path: True # Default: False. Adds qdra-inst1/qdra-inst2 folders in payload folder

    stream_server: birksat

  qdra_inst2:
    tags:
      - XD

    record: True

    transfer:
      backend: ftp3
      home: /customers/FTP/BIRKSAT
      stream_raw: False # Default: True

