tags:
  - electron
  - spaceport
  - controller
  - meos_acu
  - tracking_test

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu:
  vendor: spacetec

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://spaceport:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.106.112.29:9999
    monitor_api: http://10.106.112.29:80
    disable_monitor_websocket_stream_check: True
    session: KJ1

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: False
    mode: accept-proxy
    access: 10.106.112.29
    site: 10.106.241.101
    site_sdwan: 100.90.106.101

    nodes:
      - http://10.106.112.29:80

  specnet:
    enabled: True
    rest: http://10.106.127.30:80
    qradio_data_ip: 10.106.125.10

    autoconf:
      enabled: False
      reference_attenuation: 0
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.106.125.10
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.106.112.10

  qradio:
    enabled: True
    rest: http://10.106.112.10:8080
    specnet_data_ip: 10.106.125.30

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.106.112.10:30000

  qmr:
    enabled: True
    rest: http://10.106.127.70:80
    qdra_host_inst1: 10.106.126.11
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.106.126.11
    qdra_port_inst2: 50032
    rate: HR

    model: qmr
    control_api_id: hr_radio

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.106.112.11:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      arcsat:
        host: 100.64.18.81
        port: 5201
      smart:
        host: 100.64.18.80
        port: 5201

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.106.112.11:8081
    rate: HR2

    model: qdra
    control_api_id: hr_fep

  meos_acu:
    base_url: http://middleware.kj1.lite-kj.igns.ksat.site:3000
    influx_url: influxdb.site-tools.lite-kj.igns.ksat.site

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  controller:
    tags:
      - controller

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track

