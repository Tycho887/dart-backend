defaults:

  electron:
    ephemeris_cacher_enabled: false

    ephemeris_cacher:
      enabled: false

    electron_configure:
      enabled: false
      default_method: native
      native:
        default_naming: spacecraft+antenna

  proxy_co3d:
    base_url: http://prod-api.ksat.no:1979/proxy_sched
    proxy_start_offset_seconds: -120
    proxy_end_offset_seconds: 30

  uplink_rf_switch:
    base_url: http://10.203.116.40

  spaceport:
    base_url: http://10.203.116.48:80
    control_api_enabled: true
  
  controller:
    enabled: False

  cortex_crt1:
    device_id: "cortex_crt1"
    device_name: "cortex_crt_sg251_a"
    device_type: "cortex_crt"
    ip: "10.203.116.45"
    api_url: "http://10.203.116.48:80/mw_safran_crt"
    base_url: http://mw-safran-crt:6009

  cortex_crt2:
    device_id: "cortex_crt2"
    device_name: "cortex_crt_sg251_b"
    device_type: "cortex_crt"
    ip: "10.203.116.46"
    api_url: "http://10.203.116.48:80/mw_safran_crt_backup"
    base_url: http://mw-safran-crt-backup:6010

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: True
    publish_tracking_file: True
    use_cosmic_metrics: true
    cosmic_host: 10.203.127.150
    cosmic_port: 5432
    cosmic_username: electron
    cosmic_password: electron

  orbital:
    enabled: False

  proxy:
    enabled: False

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False
    
  qfep:
    enabled: False    

  wb_specnet:
    enabled: False
    
  wb_specnet2:
    enabled: False    

  qrx:
    enabled: False

  qrx1:
    enabled: False    

  qrx2:
    enabled: False    
    
  qdra-inst1:
    enabled: False
 
  qdra-inst2:
    enabled: False
  
  qmr:
    enabled: False

electron:

  electron:
    parameters:
      monitor_api:
        base_url: http://10.203.116.48:80/scraper
        start_padding: 30
        end_padding: 30


services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  proxy_co3d: {}
  uplink_rf_switch: {}
  cortex_crt1: {}
  cortex_crt2: {}
  nkom: {}
