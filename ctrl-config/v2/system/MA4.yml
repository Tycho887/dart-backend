tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu:
  vendor: orbital
  model: 3.0TSS3-3.7m
  feed: FTSS-XX-CC-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - rhcp
      - lhcp
    SU:
      - dual

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.101.42.81:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.101.42.41:9999
    # monitor_api: http://10.101.42.40:80
    disable_monitor_websocket_stream_check: True
    auto_pull: 0
    session: MA4

  orbital:
    host: 10.101.42.10
    rest: http://10.101.42.20:3004
    vendor: orbital
    model: 3.0TSS3-3.7m
    feed: FTSS-XX-CC-01
    hpa: PA-01
    converter: MM-SST-01
    control_api_id: acu
    polarizations:
      SD:
        - dual
      XD:
        - lhcp
        - rhcp
      SU:
        - dual

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.101.42.81
    site: 10.134.241.105
    site_sdwan: 100.90.134.105

    nodes:
      - http://10.101.42.81:80

  specnet:
    enabled: True
    rest: http://10.101.42.26:80
    qradio_data_ip: 10.101.47.10
    input_power_mode: inputPower_LR
    rate: LR

    autoconf:
      enabled: True
      reference_attenuation: 26
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.101.47.10
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.101.42.30

  qradio:
    enabled: True
    rest: http://10.101.42.30:8080
    specnet_data_ip: 10.101.47.20

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.101.42.30:30000

  wb_specnet:
    enabled: False
    rest: http://10.134.127.51:80

  wb_specnet2:
    enabled: False

  qmr:
    enabled: False

  qrx:
    enabled: False
    rest: http://10.134.112.45:8080
    qdra_host_inst1: 10.134.126.5
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.134.126.5
    qdra_port_inst2: 50032
    rate: HR

    model: qmr
    control_api_id: hr_radio

  qrx2:
    enabled: False

  qdra-inst1:
    enabled: False
    inst: 1
    rest: http://10.134.112.43:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep
    stream_servers:

  qdra-inst2:
    enabled: False
    inst: 2
    rest: http://10.134.112.43:8081
    rate: HR2

    model: qdra

    control_api_id: hr_fep

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.101.42.20
        user: ma4
        dest: /home/ma4/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
