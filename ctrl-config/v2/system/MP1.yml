tags:
  - electron
  
post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu: {}

defaults:

  electron:
    ephemeris_cacher_enabled: true

    ephemeris_cacher:
      enabled: true

    electron_configure:
      enabled: true
      default_method: native
      native:
        default_naming: spacecraft+antenna

  spaceport:
    enabled: False

  controller:
    enabled: False

  orbital:    
    enabled: False
    host: 10.140.112.5

  proxy:
    enabled: False

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False
    
  qfep:
    enabled: False    

  wb_specnet:
    enabled: False
    
  wb_specnet2:
    enabled: False    

  qrx:
    enabled: False

  qrx1:
    enabled: False    

  qrx2:
    enabled: False    
    
  qdra-inst1:
    enabled: False
 
  qdra-inst2:
    enabled: False
  
  qmr:
    enabled: False

# This is used for Electron
electron:

  electron:
    parameters:
      monitor_api:
        base_url: http://10.140.112.12:80/scraper
        start_padding: 30
        end_padding: 30

  realtime_processors:
    parameters:
      tracking_analyzer:
        backend: electron

      hpa_analyzer:
        enabled: true
        backend: electron

      doppler_analyzer: {}

  ksat_antenna_configurator:
    parameters:
      backend: ksat_acu_orbital      
      base_url: http://ksat_acu_orbital:5000

      ksat_acu_orbital_config:
        host: 10.140.112.5
        port: 7007

      config_mode: auto

      commands:
        s_tx_polarity:
          mode: auto

        hpa_output_control:
          output: feed # feed | test

        hpa_status:
          mode: on # on | auto | off

        hpa_input_attenuation:
          config_mode: manual
          attenuation: 10  # 0 < 31.75

        fiber_a_tx_attenuation:
          config_mode: manual
          attenuation: 15

        fiber_b_tx_attenuation:
          config_mode: manual
          attenuation: 15

        ltu_x_state:
          state: False

        ltu_x_input_frequency:
          frequency: 1260

        ltu_x_output_frequency:
          frequency: 8210
    
  proxy:
    parameters:
      base_url: http://10.140.112.13:80
      services: []
      whitelist: []      
      open: -30
      close: 30
      kill: 5
      open_control: -5

  nb_spectralnet:
    parameters:
      base_url: http://10.140.127.30:80
      instance: 1
      # config:
      peer: 10.140.125.10
      init_teardown: 30

      config_mode: manual
      input_frequency_mode: auto
      output_frequency_mode: auto
      tx_link_1_id: ttc_tx_link_1_id
      rx_link_1_id: ttc_rx_link_1_id
      x_band_rx_down_conversion_frequency: 6950000000
      x_band_tx_up_conversion_frequency: 6950000000

      polarity_map_in_rhcp: rfIn1
      polarity_map_in_lhcp: rfIn2

      auto_config:
        peer_host: 10.140.125.10
        peer_port: 50000
        reference_attenuation: 9
        reference_attenuation_adjustment: 0
        input_frequency_mode: auto
        input_frequency: 67500000
        system_bandwidth: 10000000
        gain_mode: auto
        # rf_input_port: rfIn2
        rf_input_port: null  # Set to null to automatically set using spacecraft link(rx_link_1_id)
        ad_bits: 8
        input_stream_offset: 2500000
        max_packet_size: 1500
        stream_bandwidth: 4000000
        packet_protection_enabled: true
        rx_enabled: true
        tx_enabled: true
        attenuation: 9
        input_stream_id: 0
        invert_output_spectrum: false
        rf_output_port: rfOut1
        output_frequency: 68500000
        rf_output_source: Packets
        data_source: Network
        programmed_buffer: 0
        programmed_delay: 0
        preserve_latency: false
        output_frequency_offset: 1500000
        use_local_reference: true
        output_stream_id: 0
        release_mode: Programmed Delay
        multicast_enabled: false
        override_output_frequency: true      

  qradio:
    parameters:
      base_url: http://10.140.112.10:8077
      instance: 1
      # config:
      peer: 10.140.125.30

      tx_link_1_id: ttc_tx_link_1_id
      rx_link_1_id: ttc_rx_link_1_id

      doppler_compensation:
        mode: auto
        enabled: true
        # frequency: 

      filerecorder:
        enabled: false

      recording_db:
        enabled: false
        base_url: http://10.140.127.211:9000

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.140.112.10:1234

          containers:
            - name: qradio

  wb_spectralnet_pri_1:
    parameters:
      base_url: http://10.140.127.52:80
      instance: 1
      # config: 

      config_mode: manual # auto | manual. Manual means that a config file will be loaded, auto will use fields below to configure.
      input_frequency_mode: auto

      rx_link_1_id: payload_rx_link_1_id
    
      x_band_rx_down_conversion_frequency: 6950000000
      
      auto_config:
        
        input_frequency_mode: auto # auto | manual
        input_center_frequency: 1250000000
        gain_mode: auto # auto | manual
        gain: 0
        invert_input_spectrum: false
        rf_input_source: External RF Input  # External RF Input | Calibration Loopback

        # RF0, defaults
        rf0_remote_host: 10.140.123.13
        rf0_enable: false
        rf0_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf0_ad_bits: 8
        rf0_in_gain_mode: manual
        rf0_in_manual_gain: 0

        # RF0, needs to be set in mission
        rf0_stream_offset: 0
        rf0_stream_bandwidth: 5000000
        rf0_stream_sample_rate: 5000000

        # RF1, defaults
        rf1_enable: false
        rf1_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf1_ad_bits: 8
        # RF1, needs to be set in mission
        rf1_stream_offset: 0
        rf1_stream_bandwidth: 5000000
        rf1_stream_sample_rate: 5000000      

  qrx_1:
    parameters:
      base_url: http://10.140.127.71:8080
      instance: 1
      # config: 

      #rx_out_host_1: 10.140.126.11
      #rx_out_host_2: 10.140.126.11
      rx_out_host_1: 100.72.4.14
      rx_out_host_2: 100.72.4.14

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.140.127.71:1234

          containers:
            - name: qrx

  wb_spectralnet_pri_2:
    parameters:
      base_url: http://10.140.127.53:80
      instance: 2
      # config: 

      config_mode: manual # auto | manual. Manual means that a config file will be loaded, auto will use fields below to configure.
      input_frequency_mode: auto

      rx_link_1_id: payload_rx_link_1_id  # rf0    

      x_band_rx_down_conversion_frequency: 6950000000

      auto_config:
        input_frequency_mode: auto # auto | manual
        input_center_frequency: 1250000000
        gain_mode: auto # auto | manual
        gain: 0
        invert_input_spectrum: false
        rf_input_source: External RF Input  # External RF Input | Calibration Loopback

        # RF0, defaults
        rf0_remote_host: 10.140.123.14
        rf0_enable: false
        rf0_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf0_ad_bits: 8
        rf0_in_gain_mode: manual
        rf0_in_manual_gain: 0

        # RF0, needs to be set in mission
        rf0_stream_offset: 0
        rf0_stream_bandwidth: 5000000
        rf0_stream_sample_rate: 5000000

        # RF1, defaults
        rf1_enable: false
        rf1_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf1_ad_bits: 8
        # RF1, needs to be set in mission
        rf1_stream_offset: 0
        rf1_stream_bandwidth: 5000000
        rf1_stream_sample_rate: 5000000      

  qrx_2:
    parameters:
      base_url: http://10.140.127.72:8080
      instance: 2
      # config: 

      #rx_out_host_1: 10.140.126.11
      #rx_out_host_2: 10.140.126.11
      rx_out_host_1: 100.72.4.14
      rx_out_host_2: 100.72.4.14

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.140.127.72:1234

          containers:
            - name: qrx

  dg_qdra_ch1:
    parameters:
      base_url: http://10.140.112.11:8081
      instance: 1
      config: qdra1

  dg_qdra_ch2:
    parameters:
      base_url: http://10.140.112.11:8082
      instance: 2
      config: qdra2

  dg_qdra_ch3:
    parameters:
      base_url: http://10.140.112.11:8083
      instance: 3
      config: qdra3

  dg_qdra_ch4:
    parameters:
      base_url: http://10.140.112.11:8084
      instance: 4
      config: qdra4

  dg_qdra_manager:
    parameters:
      base_url: http://10.140.112.11:8080
      instance: 1
      config: default

      transfer_api:
        base_url: http://10.140.112.11:7007

      contact:
        data_mode: wv1_wv2_wv3
        # channel_bit_rate: 200
        # spacecraft_config: WV1
        processing_host_name: CI1
        # strip_trailing_byte_count: 16
        dear_enable: true
        dear_asymalg_index: 2
        dear_pubkey_index: 1

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.140.112.11:1234

          containers:
            - name: dg_qdramgr
            - name: dg_qdra1
            - name: dg_qdra2
            - name: dg_qdra3
            - name: dg_qdra4

          fetch_ppr:
            - dg_qdra1
            - dg_qdra2
            - dg_qdra3
            - dg_qdra4


services:

  electron:
    tags:
      - electron
