tags:
  - electron
  
post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu: {}

defaults:

  electron:
    ephemeris_cacher_enabled: false

    ephemeris_cacher:
      enabled: true

    electron_configure:
      enabled: true
      default_method: native
      native:
        default_naming: spacecraft+antenna

  spaceport:
    enabled: False

  controller:
    enabled: False

  orbital:
    enabled: False

  proxy:
    enabled: False

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False
    
  qfep:
    enabled: False    

  wb_specnet:
    enabled: False
    
  wb_specnet2:
    enabled: False    

  qrx:
    enabled: False

  qrx1:
    enabled: False    

  qrx2:
    enabled: False    
    
  qdra-inst1:
    enabled: False
 
  qdra-inst2:
    enabled: False
  
  qmr:
    enabled: False

# This is used for Electron
electron:

  electron:
    parameters:
      monitor_api:
        base_url: http://10.133.112.94:80/scraper
        start_padding: 30
        end_padding: 30

  realtime_processors:
    parameters:
      tracking_analyzer:
        backend: maestro

      hpa_analyzer:
        enabled: true
        backend: maestro

      doppler_analyzer: {}

  ksat_antenna_configurator:
    parameters:
      backend: ksat_antenna_middleware
      base_url: http://10.133.112.94/acu

      ksat_antenna_middleware_config:
        host: 10.133.112.69
        port: 22

      config_mode: auto

      antenna_diameter: 7.3
      cable_and_feed_loss: 3.0
      max_tx_power: 47.0

      commands:
        s_tx_polarity:
          mode: auto

        hpa_output_control:
          output: feed # feed | test

        hpa_status:
          mode: on # on | auto | off

        hpa_input_attenuation:
          attenuation: 10  # 0 < 31.75

        fiber_a_tx_attenuation:
          attenuation: 20
          # Use attenuation_offset in mission to offset system attenuation
          # attenuation_offset: 0

        fiber_b_tx_attenuation:
          attenuation: 20
          # Use attenuation_offset in mission to offset system attenuation
          # attenuation_offset: 0

  nb_spectralnet:
    parameters:
      base_url: http://10.133.112.84:80
      instance: 1
      peer: 10.133.125.11
      init_teardown: 5

      config_mode: manual
      input_frequency_mode: auto
      output_frequency_mode: auto
      tx_link_1_id: ttc_tx_link_1_id
      rx_link_1_id: ttc_rx_link_1_id
      x_band_rx_down_conversion_frequency: 6950000000
      x_band_tx_up_conversion_frequency: 6950000000

      auto_config:
        peer_host: 10.133.125.11
        peer_port: 50000
        reference_attenuation: 9
        reference_attenuation_adjustment: 0
        input_frequency_mode: auto
        input_frequency: 67500000
        system_bandwidth: 10000000
        gain_mode: auto
        rf_input_port: rfIn2
        ad_bits: 8
        input_stream_offset: 2500000
        max_packet_size: 1500
        stream_bandwidth: 4000000
        packet_protection_enabled: true
        rx_enabled: true
        tx_enabled: false
        attenuation: 9
        input_stream_id: 0
        invert_output_spectrum: false
        rf_output_port: rfOut1
        output_frequency: 68500000
        rf_output_source: Packets
        data_source: Network
        programmed_buffer: 0
        programmed_delay: 0
        preserve_latency: false
        output_frequency_offset: 1500000
        use_local_reference: true
        output_stream_id: 0
        release_mode: Programmed Delay
        multicast_enabled: false
        override_output_frequency: true

  qradio:
    parameters:
      base_url: http://10.133.112.74:8080
      instance: 1
      # config:
      peer: 10.133.125.22

      tx_link_1_id: ttc_tx_link_1_id
      rx_link_1_id: ttc_rx_link_1_id

      doppler_compensation:
        mode: auto  # auto uses the frequency from the tx link
        enabled: true

      filerecorder:
        enabled: false

      recording_db:
        enabled: false
        base_url: http://10.133.127.211:9000

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.133.112.74:1234

          containers:
            - name: qradio

  wb_spectralnet_pri_1:
    parameters:
      base_url: http://10.133.112.86:80
      instance: 1
      # config:

      config_mode: manual # auto | manual. Manual means that a config file will be loaded, auto will use fields below to configure.
      input_frequency_mode: auto

      rx_link_1_id: payload_rx_link_1_id
    
      x_band_rx_down_conversion_frequency: 6950000000
      
      auto_config:
        
        input_frequency_mode: auto # auto | manual
        input_center_frequency: 1250000000
        gain_mode: auto # auto | manual
        gain: 0
        invert_input_spectrum: false
        rf_input_source: External RF Input  # External RF Input | Calibration Loopback

        # RF0, defaults
        rf0_remote_host: 10.133.123.17
        rf0_enable: false
        rf0_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf0_ad_bits: 8
        rf0_in_gain_mode: manual
        rf0_in_manual_gain: 0
        
        # RF0, needs to be set in mission
        rf0_stream_offset: 0
        rf0_stream_bandwidth: 5000000
        rf0_stream_sample_rate: 5000000

        # RF1, defaults
        rf1_enable: false
        rf1_operational_mode: DIFI 1.1 # VITA 49.0 | DIFI 1.0 | DIFI 1.1
        rf1_ad_bits: 8
        # RF1, needs to be set in mission
        rf1_stream_offset: 0
        rf1_stream_bandwidth: 5000000
        rf1_stream_sample_rate: 5000000
  
  qrx_1:
    parameters:
      base_url: http://10.133.112.77:8080
      instance: 1
      # config:

      rx_out_host_1: 10.133.126.21
      rx_out_host_2: 10.133.126.21

      filerecorder:
        enabled: false

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.133.112.77:1234

          containers:
            - name: qrx

  qrx_1_9:
    parameters:
      base_url: http://10.133.112.77:8080
      instance: 1
      # config:

      rx_out_host_1: 10.133.126.21
      rx_out_host_2: 10.133.126.21

      filerecorder:
        enabled: false

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.133.112.77:1234

          containers:
            - name: qrx-19

