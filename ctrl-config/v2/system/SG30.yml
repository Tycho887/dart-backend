---
tags:
  - controller
  - electron
  - spaceport
  - tracking_test
  - acu
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file    

acu:
  vendor: orbital
  model: 7.3AE3BP-7.3M
  feed: FTSXS-XBX-PCP-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    XD:
      - dual


defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.103.30.11
    control_api_enabled: False
    monitor_api_enabled: False
    ephemeris_cacher_enabled: false

  controller:
    disable_monitor_websocket_stream_check: True
    auto_pull: 0
    session: SG30

  downlink_mtx:
    block: svalsat_1
    host: 10.103.0.140
    port: 4000
    vendor: etl
    model: nigma
    mode: downlink
    size: 32

    def_routes:
      - [DL, SDL]
      - [DL, XDL]

    null: NULL

  scheduler:
    host: localhost
    type: vm

  orbital:
    host: 127.0.0.1
    rest: http://127.0.0.1:30000
    vendor: orbital
    model: 3.0TSXS7-3.7m
    feed: FTSXS-XBX-PCP-01
    hpa: PA-01
    converter: MM-SST-01
    polarizations:
      XD:
        - dual

services:
  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 127.0.0.1
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
