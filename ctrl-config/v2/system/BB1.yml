---
tags:
  # - electron
  # - spaceport
  - controller
  - meos
  - yagi
  - tracking_test

acu:
  vendor:
  model:
  feed:
  hpa:
  converter:

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://spaceport:80
    control_api_enabled: false
    monitor_api_enabled: false
    ephemeris_cacher_enabled: false

  controller:
    control_api: http://10.125.1.81:9999
    session: BB1

  yagi:
    enabled: True

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.125.1.81
    site: 10.125.241.111
    site_sdwan: 100.90.125.111

    nodes:
      - http://10.125.1.81:5000

  specnet:
    rest: http://10.125.127.30:80

    autoconf:
      enabled: False
      reference_attenuation: -- # insert
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: -- # insert
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  qradio:
    rest: http://10.125.1.82:8080
    specnet_data_ip: 10.125.125.30

    model: qradio
    control_api_id: lr_radio

  qfep:
    rest: http://10.125.1.82:30000

  ctx:
    host: 10.125.1.82

  qmr:
    enabled: False

  qdra-inst1:
    enabled: False

  qdra-inst2:
    enabled: False

  wb_specnet:
    enabled: False

  wb_specnet2:
    enabled: False

  qrx:
    enabled: False
  
  qrx2:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  controller:
    tags:
      - controller

  yagi:

    tags:
      - yagi

    influx_url: 10.125.1.11
    port: 8086
    database: uhf_vhf_antennas
    antenna: BB1

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      remote_sftp:
        method: sftp
        host: 10.125.1.11
        dest: /home/sassy/schedule/
        user: sassy


  tracking_test:

    az_median_threshold: 5.0

    tags:
      - tracking_test

    functions:
      - program_track
