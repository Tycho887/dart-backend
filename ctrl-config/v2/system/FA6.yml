tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - downlink_mtx
  - uplink_mtx
  - ksat_acu_orbital

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu:
  vendor: safran
  model: legion-400
  feed: 
  hpa:
  converter:
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual
    KA:
      - dual

defaults:

  electron:
    ephemeris_cacher_enabled: true
    host: 10.151.127.101 # new

  spaceport:
    base_url: http://10.151.112.61:80
    control_api_enabled: True
    monitor_api_enabled: True
    ephemeris_cacher_enabled: False

  controller:
    # control_api: http://10.121.112.253:9999
    # monitor_api: http://10.121.112.253:80
    auto_pull: 1
    session: FA6

  ksat_acu_orbital:
    legacy_middleware: false
    acu_type: safran_legion 
    acu_scraper_type: legion400
    base_url: http://10.151.112.61:80/acu-orbital
    rest: http://mw_orbital:6065
    host: http://10.151.112.37
    port: '80'
    reference_hpa_input_attenuation: 10
    reference_s_tx_polarity: RHCP
    reference_hpa_output_control: Feed
    reference_hpa_status: Enable

  aws_s3:
    web_proxy: 10.151.126.79:8888

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.151.112.61
    # site: None
    # site_sdwan: None

    nodes:
      - http://10.151.112.61:80

  downlink_mtx:
    block: fairbanks_iridium_2
    host: 10.151.127.190
    antenna_alias: 6
    alias: 6
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []
    null: NULL
    
  uplink_mtx:
    block: fairbanks_iridium_1
    alias: 6
    antenna_alias: 6
    host: 10.151.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []


  specnet:
    enabled: True
    rest: http://10.151.112.52:80
    qradio_data_ip: 10.151.125.101
  
    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1  # Default downlink config. Can be overridden in mission

    autoconf:
      enabled: True
      reference_attenuation: 24 
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.151.125.101
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn2"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 

  qradio:
    enabled: True
    rest: http://10.151.112.42:8080/
    specnet_data_ip: 10.151.125.51

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.151.112.42:30000

  wb_specnet:
    enabled: True
    rest: http://10.151.112.53:80
    data_ip: 10.151.126.52

    autoconf:
      enabled: True
      qrx_host_rf0: 10.151.126.102
      qrx_port_rf0: 50000

  wb_specnet2:
    enabled: True
    rest: http://10.151.112.54:80
    data_ip: 10.151.126.53

    autoconf:
      enabled: True
      qrx_host_rf0: 10.151.126.103
      qrx_port_rf0: 50000

  qrx:
    enabled: True
    rest: http://10.151.112.45:8080
    qdra_host_inst1: 10.151.126.152
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.151.126.152
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: True
    object_id: qrx
    instance: 2
    rest: http://10.151.112.46:8080
    qdra_host_inst1: 10.151.126.153
    qdra_port_inst1: 50032
    qdra_host_inst2: 10.151.126.153
    qdra_port_inst2: 50022
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.151.112.43:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      musat_cfe1:
        host: 10.151.200.7
        port: 51001

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.151.112.44:8080
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      musat_cfe1:
        host: 10.151.200.7
        port: 51001

  qmr:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  ksat_acu_orbital:
    tags:
      - ksat_acu_orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.151.112.61
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level