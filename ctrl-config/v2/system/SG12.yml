tags:
  - electron
  - spaceport
  - controller
  - meos_control

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.103.12.157:80  
    control_api_enabled: true 
    monitor_api_enabled: true 
    ephemeris_cacher_enabled: false 


  meos_control: {}

  controller:
    #control_api: http://10.103.12.157:9999
    #monitor_api: http://10.103.12.158:80 #needs to be changed
    auto_pull: 0
    session: SG12
    disable_monitor_websocket_stream_check: True  


  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.103.12.157
    site: 10.103.254.12
    sdwan: 100.90.203.12

    nodes:
      - http://10.103.12.157:80

  specnet:
    enabled: True
    rest: http://10.203.127.141:80
    qradio_data_ip: 10.203.125.12

    autoconf:
      enabled: True
      reference_attenuation: 
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.203.125.12
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.203.114.138

  qradio:
    enabled: True
    rest: http://10.103.12.138:8080
    specnet_data_ip: 10.203.125.141

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.103.12.138:30000

  wb_specnet:
    enabled: False

  qrx:
    enabled: False

  qdra-inst1:
    enabled: False

  qdra-inst2:
    enabled: False


  qmr:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport


  meos_control:
    tags:
      - meos_control

  controller:
    tags:
      - controller

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.103.12.157
        user: orbital
        dest: /home/orbital/schedule
