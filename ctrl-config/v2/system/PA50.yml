---
tags:
  - electron
  - spaceport
  - acu
  - scheduler
  - controller
  - meos
  - tracking_test
#  - meos_generator
#  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-XBX-PCP-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.117.112.29:80 #byttet
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.117.13.150:9999
    session: PA50

  aws_s3:   
    web_proxy: 10.117.126.79:8888

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  downlink_mtx:
    alias: 1
    host: 10.117.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16

    def_routes: []

    null: NULL

  uplink_mtx:
    alias: 1
    host: 10.117.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16

    def_routes: []

  scheduler:
    host: localhost
    type: vm

  orbital:
    host: 10.117.112.5 # byttet
    rest: http://10.117.112.29:30000  #byttet
    use_monitor: false

  proxy:
    enabled: False
    #    operational: True
    #    mode: accept-proxy
    #    access: 10.117.13.150
    #    site: 10.117.241.150
    #
    #    nodes:
    #      - http://10.117.13.150:5000

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False

  qfep:
    enabled: False

  qmr:
    enabled: False

  qdra-inst1:
    enabled: False

  qdra-inst2:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  controller:
    tags:
      - controller

  orbital:
    tags:
      - acu

  scheduler:
    tags:
      - scheduler

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos_generator:
    tags:
      - meos_generator

    object_id: meos_generator

  meos:
    tags:
      - meos

    object_id: meos

    #dests:
    #  local:
    #    method: local
    #    dest: /home/pa50/schedule

    dests:
      orbital:
        method: sftp
        host: 10.117.112.29
        user: orbital
        dest: /home/orbital/schedule        

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
