      - http://10.134.112.93:80

  downlink_mtx:
    block: mauritius_2
    alias: 6
    antenna_alias: 6
    host: 10.134.127.199
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []
    null: NULL

  uplink_mtx:
    block: mauritius_1
    alias: 6
    antenna_alias: 6
    host: 10.134.127.199
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  specnet:
    enabled: True
    rest: http://10.134.127.32:80
    qradio_data_ip: 10.134.125.6

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1  # Default downlink config. Can be overridden in mission

    autoconf:
      enabled: True
      reference_attenuation: 30
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.134.125.6
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: 'rfIn1'
        s_lhcp: 'rfIn2'
        x_rhcp: 'rfIn1'
        x_lhcp: 'rfIn2'

      rf_output_port_rules:
        s_rhcp: 'rfOut1'
        s_lhcp: 'rfOut1'
        x_lhcp: 'rfOut1'
        x_rhcp: 'rfOut2'

  ctx:
    enabled: True
    host: 10.134.112.74

  qradio:
