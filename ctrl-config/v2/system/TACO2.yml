tags:
  - controller
  - meos_control
  - oem_table_track
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

defaults:

  meos_control: {}

  orbital:
    orbital:
    host: localhost
    rest: http://localhost:30000

  controller:
    control_api: http://10.143.112.61:9999
    monitor_api: http://10.143.112.62:80
    auto_pull: 0
    session: TACO2

  aws_s3:
    web_proxy: localhost:3128

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.143.112.61
    site: 10.143.241.101
    site_sdwan: 100.90.102.202

    nodes:
      - http://10.143.112.61:80

  downlink_mtx:
    block: taco1
    host: 172.22.96.20
    port: 4000
    antenna_alias: 2
    alias: 2
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []
    null: NULL

  uplink_mtx:
    block: taco1
    host: 172.22.96.20
    port: 4000
    antenna_alias: 2
    alias: 2
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: [SU, U]

  specnet:
    enabled: True
    rest: http://10.143.112.52:80
    qradio_data_ip: 10.143.125.100

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1  # Default downlink config. Can be overridden in mission

    autoconf:
      enabled: True
      reference_attenuation: 40 
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.143.125.100
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.143.112.42

  qradio:
    enabled: True
    rest: http://10.143.112.42:8080
    specnet_data_ip: 10.143.125.52

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.143.112.42:30000

  wb_specnet:
    enabled: True
    rest: http://10.143.112.53:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.143.123.100
      qrx_port_rf0: 50000
      qrx_host_rf1: 10.143.123.101
      qrx_port_rf1: 50000
  
  wb_specnet2:
    enabled: False
    rest: http://10.143.112.54:80

  qrx:
    enabled: True
    rest: http://10.143.112.45:8080
    qdra_host_inst1: 10.143.126.150
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.143.126.150
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: True
    object_id: qrx
    instance: 2
    rest: http://10.143.112.47:8080
    qdra_host_inst1: 10.143.126.151
    qdra_port_inst1: 50032
    qdra_host_inst2: 10.143.126.151
    qdra_port_inst2: 50022
    rate: HR

    model: qrx
    control_api_id: hr_radio


  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.143.112.43:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      satellogic: 
        host: 10.143.209.12
        port: 56001


  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.143.112.48:8080
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      satellogic:
        host: 10.143.209.12
        port: 56002

  qmr:
    enabled: False

  falcon:
    recorders:
      - hypermatter_api: http://10.143.112.43:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst1/"
                delimiter: "_"

      - hypermatter_api: http://10.143.112.48:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst2/"
                delimiter: "_"

services:
  oem_table_track:
    tags:
      - oem_table_track

  meos_control:
    tags:
      - meos_control

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.103.12.157
        user: orbital
        dest: /home/orbital/schedule
