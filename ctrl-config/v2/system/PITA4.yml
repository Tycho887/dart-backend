tags:
  - controller
  - electron
  - spaceport

defaults:

  electron:
    ephemeris_cacher_enabled: False

  spaceport:
    base_url: http://spaceport:80
    control_api_enabled: true
    monitor_api_enabled: true

  controller:
    disable_monitor_websocket_stream_check: True
    auto_pull: 1
    session: PITA4

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False

  qfep:
    enabled: False

  qmr:
    enabled: False

  wb_specnet:
    enabled: False
  
  qrx:
    enabled: False

  qdra-inst1:
    enabled: False

  qdra-inst2:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  controller:
    tags:
      - controller
