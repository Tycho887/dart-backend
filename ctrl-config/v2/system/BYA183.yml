#    access: 10.137.128.240
#    site: 10.137.254.240
#    sdwan: 100.90.137.240
#
#    nodes:
#      - http://10.137.128.240:80

  downlink_mtx:
    host: 10.137.128.70
    block: bya_1
    antenna_alias: 1
    alias: 1
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []

    null: NULL


  uplink_mtx:
    block: bya_1
    antenna_alias: 1
    alias: 1
    host: 10.137.128.70
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  scheduler:
    host: localhost
    type: vm

  specnet:
    enabled: True
    rest: http://10.137.128.15:80
    qradio_data_ip: 10.137.125.115

    autoconf:
      enabled: True
      reference_attenuation: 20
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.137.125.115
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 3
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 20
      rfOutputPort: 'rfOut1'
      outputFrequency: 67.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 2.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

# Used only for proxy routing
