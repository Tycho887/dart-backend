tags:
  - electron
  - spaceport
  - controller
  - downlink_mtx
  - uplink_mtx  

defaults:

  electron:
    ephemeris_cacher_enabled: false

  spaceport:
    base_url: http://10.137.128.183:80  
    control_api_enabled: false 
    monitor_api_enabled: false 
    ephemeris_cacher_enabled: false 


  meos_control: {}

  controller:
    #control_api: http://10.137.128.157:9999
    #monitor_api: http://10.137.128.158:80 #needs to be changed
    auto_pull: 0
    session: BYA183
    disable_monitor_websocket_stream_check: True  

#  ftp3:
#    host: 192.146.239.4
#    port: 22
#
#  ftpSvalSat:
#    host: 172.23.99.11
