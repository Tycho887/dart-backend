    enabled: true
    rest: http://10.137.128.115:8080
    specnet_data_ip: 10.137.125.15

#    model: qradio
#    control_api_id: lr_radio

  qfep:
    enabled: false

  wb_specnet:
    enabled: False

  qrx:
    enabled: False

  qdra-inst1:
    enabled: False

  qdra-inst2:
    enabled: False

  qmr:
    enabled: False

services:

  scheduler:
    tags:
      - scheduler

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos_control:
    tags:
      - meos_control

  controller:
    tags:
      - controller

