tags:
  - scheduler
  - meos_generator

acu:
  vendor: TACO
  model:
  feed:
  hpa:
  converter:
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:
  orbital:
    rest: http://10.119.102.30:3001
    proxy_port: 10001

  controller:
    monitor_api: http://172.22.96.97:80
    auto_pull: 0
    session: TACO1

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  aws_s3:
    web_proxy: http://proxy.ksat.site:3128

  proxy:
    access: localhost
    mode: accept-proxy
    site: 10.102.241.104
    site_sdwan: 100.90.1.2
    operational: True
    nodes:
      - http://localhost:5001

  downlink_mtx:
    host:
    port: 4000
    vendor: etl
    model: nigma
    mode: downlink

  uplink_mtx:
    host:
    port: 4000
    vendor: etl
    model: nigma
    mode: uplink


  scheduler:
    host: localhost
    type: vm

  specnet:
    rest: http://172.22.96.18:80
    qradio_data_ip: 172.22.97.15

    autoconf:
      enabled: False
      reference_attenuation: 0
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 172.22.97.15
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    host: 172.22.96.15

  qradio:
    rest: http://172.22.96.15:8080
    specnet_data_ip: 172.22.97.18

  qfep:
    rest: http://172.22.96.15:30000

  qmr:
    rest: http://172.22.96.19:80
    qdra_host_inst1: 10.10.10.11
    qdra_port_inst1: 50022
    qdra_host_inst2: 172.22.97.16
    qdra_port_inst2: 50032
    personalities:
      DVB-S2:  AA-11644-100+DVB-S2+Uplink+Rx2+QLegs
      TCM: AA-11644-100+TCM+Rx2
      default_personality: AA-11644-100+DVB-S2+Uplink+Rx2+QLegs # Personality to load at LOS

  wb_specnet:
    enabled: True
    rest: http://172.22.96.13:80

    autoconf:
      enabled: True
      qrx_host_rf0: 172.22.97.117

  qdra-inst1:
    inst: 1
    rest: http://localhost:8080
    stream_servers:
      iceye:
        host: 127.0.0.1
        port: 9199

  qdra-inst2:
    inst: 2
    rest: http://172.22.96.16:8081

services:

  scheduler:
    tags:
      - scheduler

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: nigma

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: nigma

  meos_generator:
    tags:
      - meos_generator

    object_id: meos_generator

