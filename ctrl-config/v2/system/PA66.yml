tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PBP-101-01
  hpa: PA-03
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.117.114.29:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.117.114.29:9999
    # monitor_api: http://10.117.114.29:80
    auto_pull: 0
    session: PA66

  orbital:
    host: 10.117.114.5
    rest: http://10.117.114.29:30000
    vendor: orbital
    model: orbital
    feed:  FTSXS-0B0-PBP-101-01
    hpa: PA-03
    converter: MM-SST-01
    control_api_id: acu
    polarizations:
      SD:
        - dual
      XD:
        - dual
      SU:
        - dual

  aws_s3:
    web_proxy: 10.117.126.79:8888

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.117.114.29
    site: 100.90.117.166
    site_sdwan: 100.90.117.166
    nodes:
      - http://10.117.114.29:80

  downlink_mtx:
    block: punta_arenas_2
    alias: 5
    antenna_alias: 5
    host: 10.117.127.191
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []

    null: NULL

  uplink_mtx:
    block: punta_arenas_2
    alias: 5
    antenna_alias: 5
    host: 10.117.127.191
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  specnet:
    enabled: True
    rest: http://10.117.114.20:80
    qradio_data_ip: 10.117.125.137

    autoconf:
      enabled: True
      reference_attenuation: 23
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.117.125.137
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn2"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.117.114.10

  qradio:
    enabled: True
    rest: http://10.117.114.10:8080
    specnet_data_ip: 10.117.125.42

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.117.114.10:30000

  qmr: 
    enabled: False

  wb_specnet:
    # RHC
    enabled: True 
    rest: http://10.117.114.21:80

    autoconf: 
      enabled: True
      qrx_host_rf0: 10.117.126.137
      qrx_port_rf0: 50000

  wb_specnet2:
    # LHC
    enabled: True
    rest: http://10.117.114.22:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.117.126.187
      qrx_port_rf0: 50000

  qrx:
    enabled: True
    rest: http://10.117.114.13:8080
    qdra_host_inst1: 10.117.126.239
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.117.126.239
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: True
    object_id: qrx
    instance: 2
    rest: http://10.117.114.14:8080
    qdra_host_inst1: 10.117.126.240
    qdra_port_inst1: 50032
    qdra_host_inst2: 10.117.126.240
    qdra_port_inst2: 50022
    rate: HR

    model: qrx
    control_api_id: hr_radio
    
  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.117.114.11:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      ororatech:
        host: 10.117.126.9
        port: 7914
#      iceye:
#        host: 10.117.126.9
#        port: 9199


  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.117.114.12:8080
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.117.114.29
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
