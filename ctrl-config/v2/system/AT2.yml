services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.124.112.47
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
