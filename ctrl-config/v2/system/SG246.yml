tags:
  - electron
  - spaceport
  - controller
  - ksat_acu_orbital

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu:
  vendor: #orbital
  model: #3.0TSXS7-3.7m
  feed: #FTSXS-0B0-PBP-101-01
  hpa: #PA-03
  converter: #MM-SST-01
  #polarizations:
  #  SD:
  #    - dual
  #  XD:
  #    - dual
  #  SU:
  #    - dual

defaults:

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: false
    publish_tracking_file: true

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.203.119.29:80
    control_api_enabled: true
    monitor_api_enabled: true

  controller:
    # control_api: http://10.203.119.29:9999
    # monitor_api: http://10.203.119.29:80
    auto_pull: 1
    session: PA17

  aws_s3:
    web_proxy: 10.203.126.79:8888

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  #marius_ftp:
  #  host: 10.141.177.148
  #  user: lite
  #  port: 22

  orbital:
    host: 10.203.119.5

  ksat_acu_orbital:
    base_url: http://10.203.119.29:80/ksat_acu_orbital

    reference_hpa_input_attenuation: 10
    reference_s_tx_polarity: RHCP
    reference_hpa_output_control: Feed
    reference_hpa_status: Enable

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.203.119.29
    site: 10.103.254.246
    site_sdwan: 100.90.103.246

    nodes:
      - http://10.203.119.29:80

  # downlink_mtx:
  #   block: punta_arenas_2
  #   alias:
  #   antenna_alias:
  #   host: 10.117.127.191
  #   port: 4000
  #   vendor: etl
  #   model: victor
  #   mode: downlink
  #   size: 16

  #   def_routes: []

  #   null: NULL

  # uplink_mtx:
  #   block: punta_arenas_2
  #   alias:
  #   antenna_alias:
  #   host: 10.117.127.191
  #   port: 4000
  #   vendor: etl
  #   model: victor
  #   mode: uplink
  #   size: 16
  #   def_routes: []


  specnet:
    enabled: True
    rest: http://10.203.119.20:80
    qradio_data_ip: 10.203.125.105

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1  # Default downlink config. Can be overridden in mission

    autoconf:
      enabled: True
      reference_attenuation: 16
      inputFrequency: 2249
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.203.125.105
      networkInputPort: 50000
      streamOffset: 1
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 26
      rfOutputPort: 'rfOut1'
      outputFrequency: 2074
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: 'rfIn1'
        s_lhcp: 'rfIn2'
        x_rhcp: 'rfIn1'
        x_lhcp: 'rfIn2'

      rf_output_port_rules:
        s_rhcp: 'rfOut1'
        s_lhcp: 'rfOut1'
        x_lhcp: 'rfOut1'
        x_rhcp: 'rfOut2'

  ctx:
    enabled: True
    host: 10.203.119.10

  qradio:
    enabled: True
    rest: http://10.203.119.10:8080
    specnet_data_ip: 10.203.125.148

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.203.119.10:30000

  wb_specnet:
    enabled: True
    rest: http://10.203.119.21:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.203.126.166
      qrx_port_rf0: 50000

  wb_specnet2:
    enabled: True
    rest: http://10.203.119.22:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.203.126.167
      qrx_port_rf0: 50000

  qrx:
    enabled: True
    rest: http://10.203.119.13:8080
    qdra_host_inst1: 10.203.126.208
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.203.126.208
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: True
    object_id: qrx
    instance: 2
    rest: http://10.203.119.14:8080
    qdra_host_inst1: 10.203.126.209
    qdra_port_inst1: 50032
    qdra_host_inst2: 10.203.126.209
    qdra_port_inst2: 50022
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.203.119.11:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      ghgsat:
        host: 10.203.126.9
        port: 9010
      clyde_vireon:
        host: 10.121.126.79
        port: 7919 

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.203.119.12:8081
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:

  qmr:
    enabled: False

  falcon:
    recorders:
      - hypermatter_api: http://10.203.119.11:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst1/"
                delimiter: "_"
 
      - hypermatter_api: http://10.203.119.12:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst2/"
                delimiter: "_"

services:
  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  controller:
    tags:
      - controller

  ksat_acu_orbital:
    tags:
      - ksat_acu_orbital

  nkom: {}
