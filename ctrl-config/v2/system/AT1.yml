---
### We do not control AT1 ACU(big/ees)
tags:
  - electron
  - spaceport
  - scheduler
  - controller
#  - downlink_mtx
#  - uplink_mtx

acu:
  vendor:
  model:
  feed:
  hpa:
  converter:
  polarizations:
    SD:
    XD:
    SU:

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://spaceport:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    session: AT1

  ftpSite:
    host:

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  downlink_mtx:
    host: 10.124.127.190
    antenna_alias: 1
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes:
      - [DS, SDL]
      - [DR, XDR]
      - [DL, XDL]

  uplink_mtx:
    alias: 1
    antenna_alias: 1
    host: 10.124.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: [SU, U]

  scheduler:
    host: localhost
    type: vm

  orbital:
    host:
    rest:

  proxy:

    operational: True
    mode: accept-proxy
    access: 10.124.102.101
    site: 10.124.241.101
    site_sdwan: 100.90.124.101

    nodes:
      - http://10.124.102.101:80

  specnet:
    rest: http://10.124.102.18:80
    qradio_data_ip: 10.124.198.15
    input_power_mode: inputPower_LR

    autoconf:
      enabled: False
      reference_attenuation: 0
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.124.198.15
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    host: 10.124.102.15

  qradio:
    rest: http://10.124.102.15:8080
    specnet_data_ip: 10.124.198.18

  qfep:
    rest: http://10.124.102.15:30000

  qmr:
    rest: http://10.124.102.19:80
    qdra_host_inst1: 10.124.198.16
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.124.198.16
    qdra_port_inst2: 50032
    input_power_mode: inputPower_HR

  qdra-inst1:
    inst: 1
    rest: http://10.124.102.16:8080
    stream_servers:
      capella:
        host: 10.124.202.12
        port: 50014
      iceye:
        host: 10.124.126.79
        port: 9199
      unseenlabs:
        host: 10.124.126.79
        port: 9100

  qdra-inst2:
    inst: 2
    rest: http://10.124.102.16:8081
    stream_servers:
      capella:
        host: 10.124.202.12
        port: 50013
      iceye:
        host: 13.53.65.131
        port: 9199

  wb_specnet:
    enabled: False

  wb_specnet2:
    enabled: False
  
  qrx:
    enabled: False

  qrx2:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

#  downlink_mtx:
#    tags:
#      - downlink_mtx

#    object_id: etl_downlink

#  uplink_mtx:
#    tags:
#      - uplink_mtx

#    object_id: etl_uplink

  scheduler:
    tags:
      - scheduler

  controller:
    tags:
      - controller
