tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PCP-101-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: false
    publish_tracking_file: true

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.104.114.157:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    #control_api: http://10.104.114.157:9999
    #monitor_api: http://10.104.114.158:80
    auto_pull: 0
    session: TR15

  orbital:
    host: 10.104.114.133
    rest: http://10.104.114.157:30000
    vendor: orbital
    model: orbital
    feed:  FTSXS-0B0-PCP-101-01
    hpa: PA-01
    converter: MM-SST-01
    control_api_id: acu
    polarizations:
      SD:
        - dual
      XD:
        - dual
      SU:
        - dual

