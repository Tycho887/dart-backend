tags:
  - electron
  - controller
  - meos
  - tracking_test
  - acu
  - downlink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: orbital
  feed:  FA-B-C-01

defaults:

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: false
    publish_tracking_file: true

  electron:
    ephemeris_cacher_enabled: true

  ftp3:
    host: 192.146.239.4
    port: 22

  aws_s3:
    web_proxy: 10.203.126.79:8888
    host: aws_s3
    port: 1234

  controller:
    #control_api: http://
    auto_pull: 0
    session: SG44

  orbital:
    host: 10.103.44.10
    vendor: orbital
    model: orbital
    feed:  FA-B-C-01
    rest: http://10.203.127.91:3044

  proxy:
    operational: False
    mode: accept-proxy
    #access: 10.203.112.125
    #site: 10.103.254.121 This IP is used for SG189
    #site_sdwan: 100.90.103.121 This IP is used for SG189

    nodes:
      #- http://10.203.112.125:5000

  downlink_mtx:
    host: 10.203.127.190
    port: 4000
    vendor: etl
    model: nigma
    mode: downlink
    size: 32

    def_routes:
      - [DL, XDR]

    null: NULL

  specnet:
    enabled: False

  qradio:
    enabled: False

  qfep:
    enabled: False

  qmr:
    enabled: True
    rest: http://10.203.127.89:80
    qdra_host_inst1: 10.203.126.168
    qdra_port_inst1: 50022
    #qdra_host_inst2:
    #qdra_port_inst2: 50032
    rate: HR

    model: qmr
    control_api_id: hr_radio

  wb_specnet:
    enabled: False
  
  qrx:
    enabled: False

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.103.0.168:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

services:

  electron:
    tags:
      - electron

  orbital:

    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.203.127.91
        user: orbital
        dest: /home/orbital/schedule



  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track

  nkom: {}
