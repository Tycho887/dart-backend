tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PCP-101-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual


defaults:
  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.110.112.29:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.110.112.29:9999
    # monitor_api: http://10.199.127.240:80
    disable_monitor_websocket_stream_check: True
    auto_pull: 0
    session: IG4

  orbital:
    host: 10.199.112.37
    rest: http://10.199.112.47:3000
    vendor: orbital
    model: orbital
    feed: FTSXS-0B0-PCP-101-01
    hpa: PA-01
    converter: MM-SST-01
    control_api_id: acu
    polarizations:
      SD:
        - dual
      XD:
        - dual
      SU:
        - dual

  aws_s3:
    web_proxy: 10.199.126.79:8888

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.110.112.29
    site: 10.110.241.104
    site_sdwan: 100.90.110.104

    nodes:
      - http://10.110.112.29:80

  downlink_mtx:
    alias: 4
    antenna_alias: 4
    host: 10.199.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes:
      - [DL, SDL]
      - [DL, XDR]
      - [DL, XDL]

  uplink_mtx:
    alias: 4
    antenna_alias: 4
    host: 10.199.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: [SU, U]

  specnet:
    enabled: True
    rest: http://10.199.127.30:80
    qradio_data_ip: 10.199.125.104

    autoconf:
      enabled: True
      reference_attenuation: 28
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.199.125.104
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  wb_specnet:
    enabled: False

  wb_specnet2:
    enabled: False

  ctx:
    enabled: True
    host: 10.199.112.42

  qradio:
    enabled: True
    rest: http://10.199.112.42:8080
    specnet_data_ip: 10.199.125.30

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.199.112.42:30000

  qmr:
    enabled: True
    rest: http://10.199.127.71:80
    qdra_host_inst1: 10.199.126.104
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.199.126.104
    qdra_port_inst2: 50032
    rate: HR

    model: qmr
    control_api_id: hr_radio

    personalities:
      DVB-S2: AA-11644-001+DVB-S2+Rx2
      TCM: AA-11644-001+TCM+Rx2+QLegs
      default_personality: AA-11644-001+DVB-S2+Rx2

  qrx:
    enabled: False

  qrx2:
    enabled: False

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.199.112.43:8080
    rate: HR
    model: qdra
    control_api_id: hr_fep
    stream_servers:
      spire:
        host: 10.199.126.79
        port: 33104

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.199.112.43:8081
    rate: HR2
    model: qdra
    control_api_id: hr_fep

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.199.112.47
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
