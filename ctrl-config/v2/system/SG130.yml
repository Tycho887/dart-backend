tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
#  - acu
  - downlink_mtx
  - uplink_mtx
  - ksat_acu_orbital

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PCP-101-01
  hpa: PA-03
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: false
    publish_tracking_file: true

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.203.117.29:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.203.117.29:9999
    # monitor_api: http:/10.203.117.30:80
    auto_pull: 1
    session: SG130

#  orbital:
#    host: 10.203.117.5
#    rest: http://10.203.117.29:30000
#    vendor: orbital
#    model: orbital
#    feed:  FTSXS-0B0-PCP-101-01
#    hpa: PA-03
#    converter: MM-SST-01
#    control_api_id: acu
#    polarizations:
#      SD:
#        - dual
#      XD:
#        - dual
#      SU:
#        - dual

  ksat_acu_orbital:
    legacy_middleware: false
    acu_type: ORBITAL_ACU2 
    base_url: http://10.203.117.29:80/acu-orbital
    rest: http://mw_orbital:6065
    host: 10.203.117.5
    port: '7007'
    reference_hpa_input_attenuation: 10
    reference_s_tx_polarity: RHCP
    reference_hpa_output_control: Feed
    reference_hpa_status: Autostart

  aws_s3:
    web_proxy: 10.203.126.79:8888

  ftp3:
    host: 192.146.239.4
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.203.117.29
    site: 10.103.254.130
    site_sdwan: 100.90.103.130

    nodes:
      - http://10.203.117.29:80

  downlink_mtx: # no mtx atm
    block: svalsat_3
    alias: 30
    antenna_alias: 30
    host: 10.203.127.192
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []
    null: NULL

  uplink_mtx: # no mtx atm
    block: svalsat_3
    alias: 130
    antenna_alias: 130
    host: 10.203.127.193
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  specnet:
    enabled: True
    rest: http://10.203.117.20:80
    qradio_data_ip: 10.203.125.101

    autoconf:
      enabled: True
      reference_attenuation: 25
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.203.125.101
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.203.117.10

  qradio:
    enabled: True
    rest: http://10.203.117.10:8080
    specnet_data_ip: 10.203.125.58

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.203.117.10:30000

  wb_specnet:
    enabled: True
    rest: http://10.203.117.21:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.203.126.100
      qrx_port_rf0: 50000

  wb_specnet2:
    enabled: False

  qrx:
    enabled: True
    rest: http://10.203.117.13:8080
    qdra_host_inst1: 10.203.126.155
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.203.126.155
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: False

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.203.117.11:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      tsx:
        host: 10.203.126.79
        port: 5555
      ororatech:
        host: 10.203.126.79
        port: 7914
      endurosat:
        host: 10.203.126.79
        port: 7917
      # musat_2:
      #   host: 100.64.121.136
      #   port: 51001
      clyde_vireon:
        host: 10.121.126.79
        port: 7919

  qdra-inst2:
    enabled: False
    inst: 2
    rest: http://10.203.117.11:8081
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:

  qmr:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  ksat_acu_orbital:
    tags:
      - ksat_acu_orbital

  nkom: {}

#  orbital:
#    tags:
#      - acu
#
#    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.203.117.29
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
