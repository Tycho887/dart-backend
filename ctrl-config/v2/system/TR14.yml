tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

  - name: nkom_tracking_file
    type: nkom_tracking_file

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PCP-101-01
  hpa: PA-01
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: false
    publish_tracking_file: true

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.104.114.125:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.104.114.125:9999
    auto_pull: 0
    session: TR14

  orbital:
    host: 10.104.114.101
    rest: http://10.104.114.111:3000
    vendor: orbital
    model: orbital
    feed:  FTSXS-0B0-PCP-101-01
    hpa: PA-01
    converter: MM-SST-01
    control_api_id: acu
    use_monitor: false
    polarizations:
      SD:
        - dual
      XD:
        - dual
      SU:
        - dual

  aws_s3:
    web_proxy: 10.104.126.79:3128

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.104.114.125
    site: 10.104.241.114
    site_sdwan: 100.90.104.114

    nodes:
      - http://10.104.114.125:80

  downlink_mtx:
    block: troll_1
    alias: 14
    antenna_alias: 14
    host: 192.168.211.95
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16

    def_routes: []

  uplink_mtx:
    block: troll_1
    alias: 14
    antenna_alias: 14
    host: 192.168.211.91
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  specnet:
    enabled: True
    rest: http://10.104.127.33:80
    qradio_data_ip: 10.104.125.14

    autoconf:
      enabled: True
      reference_attenuation: 25
      inputFrequency: 67.5
      inputFrequencyOffset: 1.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn1'
      AD_bits: 8
      qradio_data_ip: 10.104.125.14
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn1"
        s_lhcp: "rfIn1"
        x_lhcp: "rfIn1"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.104.114.106

  qradio:
    enabled: True
    rest: http://10.104.114.106:8080
    specnet_data_ip: 10.104.125.33
    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.104.114.106:30000

  qmr:
    enabled: True
    rest: http://10.104.127.73:80
    qdra_host_inst1: 10.104.126.14
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.104.126.14
    qdra_port_inst2: 50032
    rate: HR
    model: qmr
    control_api_id: hr_radio

  wb_specnet:
    enabled: False

  wb_specnet2:
    enabled: False
  
  qrx:
    enabled: False

  qrx2:
    enabled: False

  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.104.114.107:8080
    rate: HR
    model: qdra
    control_api_id: hr_fep
    stream_servers:

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.104.114.107:8081
    rate: HR2
    model: qdra
    control_api_id: hr_fep
    stream_servers:

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu
    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx
    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx
    object_id: etl_uplink

  meos:
    tags:
      - meos
    object_id: meos
    dests:
      orbital:
        method: sftp
        host: 10.104.114.111
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level

  nkom: {}
