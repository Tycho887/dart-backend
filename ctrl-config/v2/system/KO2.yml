tags:
  - electron
  - spaceport
  - controller
  - meos
  - tracking_test
  - acu
  - downlink_mtx
  - uplink_mtx

post:
  - name: tracking_azimuth
    type: tracking_azimuth

  - name: tracking_elevation
    type: tracking_elevation

acu:
  vendor: orbital
  model: 3.0TSXS7-3.7m
  feed: FTSXS-0B0-PBP-101-01
  hpa: PA-03
  converter: MM-SST-01
  polarizations:
    SD:
      - dual
    XD:
      - dual
    SU:
      - dual

defaults:

  electron:
    ephemeris_cacher_enabled: true

  spaceport:
    base_url: http://10.155.112.61:80
    control_api_enabled: true
    monitor_api_enabled: true
    ephemeris_cacher_enabled: false

  controller:
    # control_api: http://10.155.112.61:9999
    # monitor_api: http://10.155.112.61:80 #needs to be changed
    auto_pull: 0
    session: KO2

  orbital:
    host: 10.155.112.37
    rest: http://10.155.112.61:30000
    vendor: orbital
    model: orbital
    feed:  FTSXS-0B0-PBP-101-01
    hpa: PA-03
    converter: MM-SST-01
    control_api_id: acu
    polarizations:
      SD:
        - dual
      XD:
        - dual
      SU:
        - dual

  aws_s3:
    web_proxy: 10.155.126.79:8888

  ftp3:
    host: 192.146.239.5
    port: 22

  ftpSvalSat:
    host: 172.23.99.11
    port: 2222

  proxy:
    operational: True
    mode: accept-proxy
    access: 10.155.112.61
    site: 100.90.155.102
    site_sdwan: 100.90.155.102

    nodes:
      - http://10.155.112.61:80

  downlink_mtx:
    block: jeju_sangdae
    alias: 2
    antenna_alias: 2
    host: 10.155.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: downlink
    size: 16
    def_routes: []

    null: NULL

  uplink_mtx:
    block: jeju_sangdae
    alias: 2
    antenna_alias: 2
    host: 10.155.127.190
    port: 4000
    vendor: etl
    model: victor
    mode: uplink
    size: 16
    def_routes: []

  specnet:
    enabled: True
    rest: http://10.155.112.52:80
    qradio_data_ip: 10.155.125.101

    autoconf:
      enabled: True
      reference_attenuation: 27
      inputFrequency: 67.5
      system_bandwidth: '10.0'
      gainMode: 'Automatic'
      rfInputPort: 'rfIn2' # Cabling error on KO
      AD_bits: 8
      qradio_data_ip: 10.155.125.101
      networkInputPort: 50000
      streamOffset: 2.5
      maxPacketSize: 1500
      streamBandwidth: 5
      packetProtectionEnable: True
      inputStreamID: 0
      rxEnable: True
      invertOutputSpectrum: False
      attenuation: 24
      rfOutputPort: 'rfOut1'
      outputFrequency: 68.5
      rfOutputSource: 'Packets'
      dataSource: 'Network'
      programmedBuffer: 0
      programmedDelay: 0
      preserveLatency: False
      networkOutputPort: 50000
      outputFrequencyOffset: 1.5
      useLocalReference: True
      outputStreamID: 0
      releaseMode: 'Programmed Delay'
      multicastEnable: False
      overrideOutputFrequencyEnable: True
      txEnable: True

      rf_input_port_rules:
        s_rhcp: "rfIn2"
        s_lhcp: "rfIn2"
        x_lhcp: "rfIn2"
        x_rhcp: "rfIn1"

      rf_output_port_rules:
        s_rhcp: "rfOut1"
        s_lhcp: "rfOut1"
        x_lhcp: "rfOut1"
        x_rhcp: "rfOut1"

  ctx:
    enabled: True
    host: 10.155.112.42

  qradio:
    enabled: True
    rest: http://10.155.112.42:8080
    specnet_data_ip: 10.155.125.51

    model: qradio
    control_api_id: lr_radio

  qfep:
    enabled: True
    rest: http://10.155.112.42:30000

  wb_specnet:
    # RHC
    enabled: True 
    rest: http://10.155.112.53:80

    autoconf: 
      enabled: True
      qrx_host_rf0: 10.155.126.102
      qrx_port_rf0: 50000

  wb_specnet2:
    # LHC
    enabled: True
    rest: http://10.155.112.54:80

    autoconf:
      enabled: True
      qrx_host_rf0: 10.155.126.103
      qrx_port_rf0: 50000

  qrx:
    enabled: True
    rest: http://10.155.112.45:8080
    qdra_host_inst1: 10.155.126.152
    qdra_port_inst1: 50022
    qdra_host_inst2: 10.155.126.152
    qdra_port_inst2: 50032
    rate: HR

    model: qrx
    control_api_id: hr_radio

  qrx2:
    enabled: True
    object_id: qrx
    instance: 2
    rest: http://10.155.112.46:8080
    qdra_host_inst1: 10.155.126.153
    qdra_port_inst1: 50032
    qdra_host_inst2: 10.155.126.153
    qdra_port_inst2: 50022
    rate: HR

    model: qrx
    control_api_id: hr_radio
    
  qdra-inst1:
    enabled: True
    inst: 1
    rest: http://10.155.112.43:8080
    rate: HR

    model: qdra
    control_api_id: hr_fep

    stream_servers:
      iceye:
        host: 10.155.126.79
        port: 7904
      blacksky:
        host: 10.0.22.10
        port: 56030

  qdra-inst2:
    enabled: True
    inst: 2
    rest: http://10.155.112.44:8081
    rate: HR2

    model: qdra
    control_api_id: hr_fep

    stream_servers:

  qmr:
    enabled: False

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  orbital:
    tags:
      - acu

    object_id: orbital

  controller:
    tags:
      - controller

  downlink_mtx:
    tags:
      - downlink_mtx

    object_id: etl_downlink

  uplink_mtx:
    tags:
      - uplink_mtx

    object_id: etl_uplink

  meos:
    tags:
      - meos

    object_id: meos

    dests:
      orbital:
        method: sftp
        host: 10.155.112.61
        user: orbital
        dest: /home/orbital/schedule

  tracking_test:
    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level
