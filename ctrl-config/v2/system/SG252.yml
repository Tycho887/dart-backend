defaults:

  electron:
    ephemeris_cacher_enabled: false

    ephemeris_cacher:
      enabled: false

    electron_configure:
      enabled: false
      default_method: native
      native:
        default_naming: spacecraft+antenna

  spaceport:
    base_url: http://10.203.115.234:80
    control_api_enabled: true
  
  controller:
    enabled: False

  nkom:
    destination:
      host: "svl-trk-cmd.ksat.no"
      path: "inbox/"
    log_tracking_file: True
    publish_tracking_file: False


  orbital:
    enabled: False

  proxy:
    enabled: False

  specnet:
    enabled: False

  ctx:
    enabled: False

  qradio:
    enabled: False
    
  qfep:
    enabled: False    

  wb_specnet:
    enabled: False
    
  wb_specnet2:
    enabled: False    

  qrx:
    enabled: False

  qrx1:
    enabled: False    

  qrx2:
    enabled: False    
    
  qdra-inst1:
    enabled: False
 
  qdra-inst2:
    enabled: False
  
  qmr:
    enabled: False

electron:

  electron:
    parameters:
      monitor_api:
        base_url: http://10.203.115.234:80/scraper
        start_padding: 30
        end_padding: 30

services:

  electron:
    tags:
      - electron

  spaceport:
    tags:
      - spaceport

  nkom: {}
