---
parameters:
  payload_rx_link_1_id: x_band_downlink_p1_1
  payload_rx_link_2_id: x_band_downlink_p1_2
  ttc_tx_link_1_id: s_band_uplink_p1_1
  ttc_rx_link_1_id: x_band_downlink_p2_1

post: []

tasks:
- name: electron
  type: electron
  parameters: {}
  
- name: realtime_processors
  type: realtime_processors
  parameters: {}  
  
- name: ksat_antenna_configurator
  type: ksat_antenna_configurator
  parameters: {}

- name: proxy
  type: proxy
  parameters:

    open: -30
    close: 30
    kill: 5
    open_control: -5

    services:
      - mc_http
      - monitor_tcp
      - dg_qfep_tcp

    whitelist:
      - 192.146.238.0/24
      - 10.198.112.10

- type: nb_spectralnet
  name: nb_spectralnet

  parameters:
    config_mode: auto

- type: qradio
  name: qradio

  parameters:
   config: WVIEW
   prime_receiver: UAQPSK

- type: wb_spectralnet
  name: wb_spectralnet_pri_1

  parameters:
    config_mode: auto

    auto_config:
      rf0_enable: true
      rf0_stream_bandwidth: 380000000
      rf0_stream_sample_rate: 475000000

- type: qrx
  name: qrx_1

  parameters:
    config: WV03_RH

- type: wb_spectralnet
  name: wb_spectralnet_pri_2

  parameters:      
    config_mode: auto

    auto_config:
      rf0_enable: true
      rf0_stream_bandwidth: 380000000
      rf0_stream_sample_rate: 475000000

- type: qrx
  name: qrx_2

  parameters:
    config: WV03_LH
