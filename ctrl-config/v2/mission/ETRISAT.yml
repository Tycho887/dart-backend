config: ETRISAT_TTC
customer: ALEN_SPACE
acu_config: ETRISAT

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.139.0/27 # Satmar sdwan
      - 172.31.244.114 # guro ip

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 1
      inputFrequency: 68
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: s_rhcp
      spectral_class_ul: s_rhcp

  qradio:
    tags:
      - SD
      - SU

    defaults:
      config: ETRISAT_TTC


