---
acu_config: SARSAT_3_LHCP
config: SARSAT_3_LOW

services:

  custom_backend:
    tags:
      - SD
      - SU

    system_specific:
      MN4:
        mtx_tags_downlink:
          - [DL, CTX1]

        mtx_tags_uplink:
          - [UCTX, U]

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 10.141.209.42 # ADD vpn adress
      - 10.141.209.41 # ADD vpn adress
      - 10.141.209.40 # ADD vpn adress
      - 172.31.244.25 # saa-nix
      #need input from IT what IP adress to whitelist from site proxy to access proxy

    services:
      - ctx_tcp
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    link_config:
      mode: spacecraft
      uplink_config: s_band_uplink_p2_1
      downlink_config: s_band_downlink_p2_1

    autoconf:
      reference_attenuation_adjustment: -3
      outputFrequency: 2082 # + 1.5
      spectral_class_ul: s_lhcp
      inputFrequency: 2260.12 # + 2.5
      spectral_class_dl: s_lhcp


