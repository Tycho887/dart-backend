---
config: UMBRASAR_2001
acu_config: UMBRASAR_2001
customer: Umbra

services:

  proxy:
    tags:
      - XD
      - SD
      - SU

    whitelist:
      - 10.250.247.0/24
      - 10.250.249.0/24
      - 192.146.238.237
      - 172.31.244.44
      - 100.64.66.0/24

    services:
      - qradio_tcp

  specnet:
    tags:
      - SD
      - SU
    autoconf:
      reference_attenuation_adjustment: 0
      spectral_class_dl: s_rhcp

  wb_specnet:
    tags:
      - XD

    autoconf: 
      inputCenterFrequency: 1200
      rf0StreamBW: 300
      rf0StreamOffset: 0

  qradio:
    tags:
      - SD
      - SU

  qfep:
    config: default
    record: False
    tags:
      - SD
      - SU
      
  qrx:
    tags:
      - XD

    config: UMBRA_03_no_viterbi

  qmr:
    tags:
      - XD

    config: UMBRA_03_no_viterbi

  qdra-inst1:
    tags:
      - XD

    record: True
    
    aws_s3_transfer:
      backend: aws_s3
      bucket_name: prod-prod-delivery-ksat-s3
      profile: umbra_prod_accelerate
      prefix: DATA
      accelerate: True
      concurrency: 2
      stream_raw: True

