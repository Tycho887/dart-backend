config: EZIE
# acu_config: Undefined config name points to ACU-config with spacecraft name

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.12.0/24 # BCT SDWAN
      - 172.31.244.44
      - 192.146.238.0/24
      - 172.31.244.25

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 0
      spectral_class_dl: s_lhcp

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft
      uplink_config: s_band_uplink_p1_1
      downlink_config: s_band_downlink_p1_1

  qradio:
    config: EZIE_MODE0
    tags:
      - SU
      - SD

  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/bct

  ksat_acu_orbital:
    tags:
      - ksat_acu_orbital
      #- SD
      #- SU
    reference_s_tx_polarity: LHCP
    link_config:
      uplink_config: s_band_uplink_p1_1
