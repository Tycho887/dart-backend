---
config: TYVAK_0129
customer: TYVAK
constellation: TYVAK
acu_config: TYVAK_0125

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.168.37.0/24
      - 10.103.222.0/24

    services:
      - qradio_tcp
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 1
      inputFrequency: 68
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: s_rhcp
      spectral_class_ul: s_rhcp

  qradio:
    tags:
      - SD
      - SU

    defaults:
      config: TYVAK_0130

    post_restart: True

  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/TYVAK
