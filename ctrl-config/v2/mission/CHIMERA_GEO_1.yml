---
#config: AF-CTA-2KD-2KU

services:

  custom_backend:
    tags:
      - SD
      - SU

    system_specific:
      BYA32:
        mtx_tags_downlink:
          - [LH1, 1SD4]   # Specnet2 input 2 via LH
          - [RH1, 1SD3]   # Specnet2 input 1 via RH
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO

        mtx_tags_uplink:
          - [1SU3, TX1]


      BYA180: #N18
        mtx_tags_downlink:
          - [LH1, 1SD4]   # Specnet2 input 2 via LH
          - [RH1, 1SD3]   # Specnet2 input 1 via RH
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO
          - [1SU3, 123I]

        mtx_tags_uplink:
          - [123O, TX1]

      BYA183: #D18
        mtx_tags_downlink:
          - [LH1, 1SD4]   # Specnet2 input 2 via LH
          - [RH1, 1SD3]   # Specnet2 input 1 via RH
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO

        mtx_tags_uplink:
          - [1SU3, TX1]

  specnet:
    tags:
      - SD
      - SU

    autoconf:
#      reference_attenuation_adjustment: 0
      system_specific:
        BYA32:
          force_attenuation: 20
        BYA180:
          force_attenuation: 20
        BYA183:
          force_attenuation: 20

