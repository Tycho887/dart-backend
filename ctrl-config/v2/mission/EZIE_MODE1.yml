config: EZIE
# acu_config: Undefined config name points to ACU-config with spacecraft name

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.12.0/24 # BCT SDWAN
      - 172.31.244.44
      - 192.146.238.0/24
      - 172.31.244.25

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1  # Default downlink config. Can be overridden in mission

    autoconf:
      reference_attenuation_adjustment: 0
      #spectral_class_dl: s_rhcp

  qradio:
    config: EZIE_MODE1
    tags:
      - SU
      - SD

  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/bct
