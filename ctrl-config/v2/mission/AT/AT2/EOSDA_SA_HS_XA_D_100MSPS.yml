config: AGRISAT_SA
acu_config: AGRISAT

services:

  proxy:
    tags:
      - SD

    whitelist:
      - 192.146.238.195
      - 100.64.34.0/24
  

    services:
      - qradio_tcp
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD

    autoconf:
      reference_attenuation_adjustment: -3
      txEnable: False

  qradio:
    tags:
      - SD
   
  qmr:
    tags:
      - XD

    defaults:
      config: EOSDA_SA_XA_100

  wb_specnet:
    config: EOSDA_SA_XA_100
    tags:
      - XD
  qrx:
    tags:
      - XD
    defaults:
      config: EOSDA_SA_XA_100
 
  qdra-inst1:
