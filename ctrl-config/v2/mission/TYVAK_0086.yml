config: TYVAK_0087

services:

  custom_backend:

    tags:
      - XD

    system_specific:

      HA3:
        mtx_tags_downlink:
          - [DR, 3SDL]

      PA51:
        mtx_tags_downlink:
          - [DR, 2SDL]

      PA52:
        mtx_tags_downlink:
          - [DR, 3SDL]

  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 192.168.37.0/24
      - 10.103.222.0/24
      - 192.146.238.172

    services:
      - ctx_tcp

  specnet:
    tags:
      - XD
      - SD

    autoconf:
      inputFrequency: 1097.5
      streamOffset: 2.5
      streamBandwidth: 5
      txEnabled: False
      spectral_class_dl: x_rhcp
            
  qradio:
    tags:
      - XD

  qfep:
    tags:
      - XD

  ctx:
    idtype: legacy
    tags:
      - XD

    transfer:
      backend: ftp3
