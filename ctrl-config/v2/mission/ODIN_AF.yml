---
#config: AF-CTA-2KD-2KU

services:

  custom_backend:
    tags:
      - SD
      - SU

    system_specific:
      BYA32:
        mtx_tags_downlink:
          - [LH2, 1LD1]   # Specnet via linedriver
          - [LD1, 1SD1]   # Specnet via linedriver
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO

        mtx_tags_uplink:
          - [1SU1, TX2]

      BYA180:
        mtx_tags_downlink:
          - [LH2, 1LD1]   # Specnet via linedriver
          - [LD1, 1SD1]   # Specnet via linedriver
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO
          - [SU1, 123I]   # Uplink N18 through 70-230 Converter

        mtx_tags_uplink:
          - [123O, TX2]

      BYA183:
        mtx_tags_downlink:
          - [LH2, 1LD1]   # Specnet via linedriver
          - [LD1, 1SD1]   # Specnet via linedriver
          #- [LH2, 1CD2]   # For Cortex monitor of AF downlink
          #- [LH2, 1SD1]   # Specnet directly from ISRO

        mtx_tags_uplink:
          - [1SU1, TX2]


  specnet:
    tags:
      - SD
      - SU

    autoconf:
#      reference_attenuation_adjustment: 0
      system_specific:
        BYA32:
          force_attenuation: 20
        BYA180:
          force_attenuation: 20
        BYA183:
          force_attenuation: 25

