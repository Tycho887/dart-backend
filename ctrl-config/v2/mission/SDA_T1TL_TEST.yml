---
config: YORK_T1TL_S_TEST
acu_config: YORK

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 172.31.244.111 # hsc-nix



    services:
      - qradio_tcp
      - mc_http

  orbital:
    auto_configure:
      system_enabled: True
      s_tx_link_1_id: ttc_tx_link_1_id
      s_rx_link_1_id: ttc_rx_link_1_id
      x_rx_link_1_id: payload_rx_link_1_id
      x_rx_link_2_id: payload_rx_link_2_id

      commands:
        s_rx_frequency:
          mode: auto # Uses frequency from s_rx_link1_1_id @ spacecraft link
          frequency: null

        s_tx_frequency:
          mode: auto # Uses frequency from s_tx_link1_1_id @ spacecraft link
          frequency: null

        s_polarization:
          mode: auto # Uses polarization from s_Xx_link1_1_id @ spacecraft link. Almost all current lite antennas only support same pol at tx / rx, so this sets both.
          polarization: null

        # X-band commands are not known by controller
        # x_rx_frequency:
        #   mode: auto # N/A for this antenna.

        # x_rx_1_polarity:
        #   mode: auto # Dual pol antenna, so N/A. Always get both!

        # x_rx_2_polarity:
        #   mode: auto # Dual pol antenna, so N/A. Always get both!


  specnet:
    tags:
      - SD
      - SU
    
    autoconf:
      enabled: True
      reference_attenuation_adjustment: -5


  qradio:
    config: NANO_SRS_4_3
    tags:
      - SD
      - SU





