---
config: SEJONG_4
acu_config: SEJONG_4

services:

  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 100.64.155.0/24 # Hancom SD-WAN
      - 172.31.244.110 # ati-nix

    services:
      - qradio_tcp
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      
  qradio:
    tags:
      - SD
      - SU

  qrx:
    tags:
      - XD

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 5
      rf0StreamBW: 100
      inputSpectralInversion: True

  qdra-inst1:
    tags:
      - XD
    
    record: True
    
    aws_s3_transfer:
      backend: aws_s3
      bucket_name: sejong4
      profile: hancom
      prefix: DATA