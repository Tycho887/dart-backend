---
config: ARTHUR_1
acu_config: ARTHUR_1
customer: AEROSPACELAB_SA
constellation: AEROSPACELAB_SA

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.53.0/24
      - 10.1.100.0/24
      - 192.146.238.172
      - 192.146.238.220
      - 192.146.238.223

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 0

  qradio:
    config: ARTHUR_1_SBT
    tags:
      - SD
      - SU

  qfep:
    config: default
    record: False
    tags:
      - SD
      - SU

  qmr: # not in use
    tags:
      - XD

  wb_specnet: # not in use
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 100
      rf0StreamBW: 54
      rf0OutGainMode: "Manual"
      rf0OutManualGain: 0

  qrx: # not in use
    tags:
      - XD

  qdra-inst1: # not in use
    tags:
      - XD

    record:
      streams: [1]

    transfer:
      backend: ftpSvalSat
      home: /data/customers/aerospacelab
