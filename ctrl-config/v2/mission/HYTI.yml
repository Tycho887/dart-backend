---
config: HYTI
acu_config: HYTI

services:
  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 192.146.238.0/24
      - 100.64.85.0/24

    services:
      - spectrum_http
      - mc_http
      - qradio_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 0

  qradio:
    tags:
      - SD
      - SU

    config: HYTI_625kbps

  qfep:
    tags:
      - SD

    tlm_record: True
    config: HYTI_record

  qmr:
    tags:
      - XD

    config: HYTI_3Mbps

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1100
      rf0StreamOffset: 42.5
      rf0StreamBW: 12

  qrx:
    tags:
      - XD

    config: HYTI_3Mbps

  qdra-inst1:
    tags:
      - XD

    record: True
