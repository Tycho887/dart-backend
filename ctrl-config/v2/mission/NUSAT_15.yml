---
config: NUSAT
acu_config: NUSAT_X

services:

  custom_backend:
    tags:
      - SD
      - SU

    dynamic_input:

      downlink:

        svalsat_1:
          SATELLOGIC_SG_CFE1:
            - [DL, NUSAT-RX2] 
            - [DL, NUSAT-AR80]
          SATELLOGIC_SG_CFE2:
            - [DL, NUSAT-RX3]
          SATELLOGIC_SG_CFE3:
            - [DL, NUSAT-RX1]
          SATELLOGIC_SG_CFE4:
            - [DL, NUSAT-RX4]

        svalsat_2:
          SATELLOGIC_SG_CFE1:
            - [DR, NUSAT-RX2]
          SATELLOGIC_SG_CFE2:
            - [DR, NUSAT-RX3]
          SATELLOGIC_SG_CFE3:
            - [DR, NUSAT-RX1]
          SATELLOGIC_SG_CFE4:
            - [DR, NUSAT-RX4]

        troll_1:
          SATELLOGIC_TR_CFE1:
            - [DL, NU1D]
          SATELLOGIC_TR_CFE2:
            - [DL, NU2D]
          SATELLOGIC_TR_CFE3:
            - [DL, NU3D]
          SATELLOGIC_TR_CFE4:
            - [DL, NU4D]

        hartebeesthoek_1:
