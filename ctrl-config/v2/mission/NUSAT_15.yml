          SATELLOGIC_PA_CFE1: [NU1U, U]
          SATELLOGIC_PA_CFE2: [NU2U, U]

        new_zealand_1:
          SATELLOGIC_NZ_CFE1: [NU1U, U]
          SATELLOGIC_NZ_CFE2: [NU2U, U]

    system_specific:


  proxy:
    tags:
      - SU
      - XD

    whitelist:
      - 192.146.238.0/24
      - 172.31.246.10
      - 172.31.244.44
      - 10.103.254.0/24
      - 10.101.19.32/27
      - 10.103.214.0/24
      - 10.104.210.0/24
      - 10.103.221.0/24
      - 10.203.233.0/28
      - 10.121.204.0/24
      - 10.117.203.0/24
      - 10.131.204.0/27

    services:
      - spectrum_http
      - mc_http
      - monitor_tcp
      - qradio_tcp

  qmr:
    config: NUSAT_1150
    tags:
      - XD
  
  wb_specnet:
    tags:
      - XD
    
    config: NUSAT_1150

    autoconf:
      inputCenterFrequency: 1150
      rf0StreamBW: 50
      rf0StreamOffset: 0

  qrx:
    tags: 
      - XD
    
    config: NUSAT_mark4
    

  qdra-inst1:
    stream_server: nusat_15
    tags:
      - XD
