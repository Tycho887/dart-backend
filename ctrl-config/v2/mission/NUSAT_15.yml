          SATELLOGIC_HA_CFE2:
            - [DL, NU2D]

        hartebeesthoek_2:
          SATELLOGIC_HA_CFE1:
            - [DR, NU1D]
          SATELLOGIC_HA_CFE2:
            - [DR, NU2D]
        
        punta_arenas_1:
          SATELLOGIC_PA_CFE1:
            - [DL, NU1D]
          SATELLOGIC_PA_CFE2:
            - [DL, NU2D]

        punta_arenas_2:
          SATELLOGIC_PA_CFE1:
            - [DR, NU1D]
          SATELLOGIC_PA_CFE2:
            - [DR, NU2D]

        new_zealand_1:
          SATELLOGIC_NZ_CFE1:
            - [DL, NU1D]
          SATELLOGIC_NZ_CFE2:
            - [DL, NU2D]

        new_zealand_2:
          SATELLOGIC_NZ_CFE1:
            - [DR, NU1D]
          SATELLOGIC_NZ_CFE2:
            - [DR, NU2D]

      uplink:
        svalsat_1:
          SATELLOGIC_SG_CFE1: [NU2, U]
          SATELLOGIC_SG_CFE2: [NU3, U]
          SATELLOGIC_SG_CFE3: [NU1, U]
          SATELLOGIC_SG_CFE4: [NU4, U]

        troll_1:
          SATELLOGIC_TR_CFE1: [NU1U, U]
          SATELLOGIC_TR_CFE2: [NU2U, U]
          SATELLOGIC_TR_CFE3: [NU3U, U]
          SATELLOGIC_TR_CFE4: [NU4U, U]

        hartebeesthoek_1:
          SATELLOGIC_HA_CFE1: [NU1U, U]
          SATELLOGIC_HA_CFE2: [NU2U, U]
        
