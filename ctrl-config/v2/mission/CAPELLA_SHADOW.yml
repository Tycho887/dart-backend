config: CAPELLA_2
acu_config: CAPELLA_2

services:


  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.143.0/24

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
 
  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 2
      inputFrequency: 1076
      streamOffset: 1
      streamBandwidth: 2
      gainMode: 'Automatic'
      packetProtectionEnable: False
      spectral_class_dl: x_rhcp
      txEnable: False


  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 250
      rf0OutGainMode: "Manual"
      rf0OutManualGain: 0

  wb_specnet2:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 250
      rf0InGainMode: "Manual"
      rf0InManualGain: 0
  
  qradio:
    tags:
      - SD
      - SU

  qfep:
    tags:
      - SD
      - SU

  qrx:
    tags:
      - XD

   

  qmr:
    tags:
      - XD

   

  qdra-inst1:
    config: CAPELLA_2
    tags:
      - XD
    
    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: capella-prod-gsw-downlink-data-commercial
      profile: capella
      prefix: ksat
      post_transfer_delete: True
      inst_path: True
     


      

  qdra-inst2:
    config: CAPELLA_2
    tags:
      - XD
    
    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: capella-prod-gsw-downlink-data-commercial
      profile: capella
      prefix: ksat
      post_transfer_delete: True
      inst_path: True
      

