---
kind: minimal
config: RL_LC1_DL256
acu_config: F15

tags:
  - disable_acu

services:

  proxy:
    tags:
      - SD
      - SU

    whitelist:
      - 192.146.238.128/25

    services:
      - acu_tcp
      - qradio_tcp
      - qradio_http
      - spectrum_http
  
  specnet:
    
    defaults:
      config: RL_F13
    
    tags:
      - SD
      - SU

  qradio:
    tags:
      - SD
      - SU

    record: True
    transfer:
      recording_path: /home/rtlogic/electron/recordings
      backend: ftpSvalSat
      home: /data/customers/rocketlab

  photon:
    tags:
      - SD
      - SU

    transfer:
      recording_path: /home/rtlogic/electron/recordings
      backend: ftpSvalSat
      home: /data/customers/rocketlab

  electron:
    tags:
      - SD
      - SU

