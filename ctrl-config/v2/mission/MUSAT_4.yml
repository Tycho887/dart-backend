config: MUSAT
acu_config: MUSAT_2

services:

  custom_backend:
    tags:
      - SU
      - XD

    dynamic_input:

      downlink:
        svalsat_3:
          MUON_SG_CFE1:
            - [DL, MUR1]
          MUON_SG_CFE2:
            - [DL, MUR2]

        new_zealand_1:
          MUON_NZ_CFE1:
            - [DL, MUR1]

        new_zealand_2: #used for NZ3 (dual pol antenna)
          MUON_NZ_CFE1:
            - [DR, MUR1]


      uplink:
        svalsat_3:
          MUON_SG_CFE1: [MUT1, U]
          MUON_SG_CFE2: [MUT2, U]

        new_zealand_1:
          MUON_NZ_CFE1: [MUT1, U]
  proxy:
    tags:
      - XD

    whitelist:
      - 172.31.244.0/24
      - 100.64.121.0/24
      - 172.31.244.44
      - 100.64.121.128/28
      - 100.64.121.248/29
      - 12.40.220.140
      - 52.183.85.92
      - 52.183.13.48
      - 10.10.0.101
      - 10.10.0.109
      - 100.64.115.0/26

    services:
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - XD

    autoconf:
      inputFrequency: 1432.5
      streamOffset: 2.5
      txEnable: False
      spectral_class_dl: x_rhcp

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 5
      rf0StreamBW: 92 #TODO: Change to 250 MHz

  qrx:
    tags:
      - XD
#    config: MUSAT_192_MSPS #TODO

  qdra-inst1:
    stream_server: musat_cfe1
    tags:
      - XD
