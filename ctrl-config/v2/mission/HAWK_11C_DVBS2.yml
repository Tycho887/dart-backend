config: HAWK_2C
acu_config: HAWK_5CX

services:

  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 10.103.235.0/24
      - 10.104.213.0/24
      - 192.146.238.172
      - 192.146.238.242
      - 10.117.235.0/24
      - 10.121.235.0/24
      - 10.131.235.0/24
      - 10.197.255.0/28
      - 10.141.209.0/28
      - 10.120.201.32/28
  

    services:
      - qradio_tcp
      - qradio_http
      - qmr_http
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU
      - XD

    autoconf:
      reference_attenuation_adjustment: -3
      inputFrequency: 1351
      inputFrequencyOffset: 2
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: x_rhcp

  wb_specnet:
    config: HAWK_2C
    tags:
      - XD
    
    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: -10
      rf0StreamBW: 200
      inputSpectralInversion: True
      

  qradio:
    config: HAWK_2CX
    tags:
      - SD
      - SU
      - XD

  qrx:
    config: HAWK_DVBS2
    tags:
      - XD
      
  qrx2:
    config: HAWK_DVBS2
    tags:
      - XD

  qmr:
    tags:
      - XD

    config: HAWK_C_DVBS2

  qdra-inst1:
    config: HAWK_DVBS2
    stream_server: hawk_11c
    tags:
      - XD
