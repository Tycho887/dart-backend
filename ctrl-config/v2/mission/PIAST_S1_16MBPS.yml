config: PIAST_S1
acu_config: PIAST_S1

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.242 # ben-nix
      - 172.31.244.25   # saa-nix
      - 172.31.244.44 #mep-nix
      - 192.168.181.118 # creotech IP from netbox
      - 192.168.181.119 # creotech IP from netbox
      - 100.64.75.0/24  # creotech sdwan range

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 0

  qradio:
    tags:
      - SD
      - SU

  qfep:
    config: EAGLEEYE
    tags:
      - SD
      - SU

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: -5
      rf0StreamBW: 32

  qrx:
    config: EAGLEEYE_16M66bps
    tags:
      - XD

  qdra-inst1:
    config: EAGLEEYE
    tags:
      - XD

    record: True
    
    aws_s3_transfer:
      backend: aws_s3
      bucket_name: creotech-ksat-xband
      profile: creotech

