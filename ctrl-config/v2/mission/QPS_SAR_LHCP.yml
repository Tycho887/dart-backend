config: QPS_SAR_2
acu_config: QPS_SAR_2_LHCP

services:

  custom_backend:
    tags:
      - XD
    
    mtx_tags_downlink:
      - [DL, IQPS]

    system_specific:      

      SG185:
        mtx_tags_downlink:
          - [DL, IQPSL]

      SG219:
        mtx_tags_downlink:
          - [DL, IQPSL]
      
      SG220:
        mtx_tags_downlink:
          - [DL, IQPSL]
      
      PA51:
        mtx_tags_downlink:
          - [DL, QPSL]
 
      PA52:
        mtx_tags_downlink:
          - [DL, QPSL]
      
      NZ2:
        mtx_tags_downlink:
          - [DL, IQPL]
      
      NZ3:
        mtx_tags_downlink:
          - [DL, IQPL]
      
      PL2:
        mtx_tags_downlink:
          - [DL, QPSL]
      
      PL3:
        mtx_tags_downlink:
          - [DL, QPSL]

      MN3:
        mtx_tags_downlink:
          - [DL, QPSL]

      MN4:
        mtx_tags_downlink:
          - [DL, QPSL]

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 172.31.64.144
      - 192.146.238.220
      - 172.31.244.44
      - 100.64.51.0/24 # iqps sw-wan

    services:
      - qradio_tcp
      - qradio_http
      - mc_http
      - spectrum_http      

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -1
      spectral_class_dl: s_rhcp
      
  qradio:
    tags:
      - SD
      - SU

  qmr:
    config: QPS_DUMMY
    tags:
      - XD
