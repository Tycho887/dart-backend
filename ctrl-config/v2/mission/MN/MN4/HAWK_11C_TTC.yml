config: HAWK_2C
acu_config: HAWK_7C_TTC

services:

  custom_backend:

    tags:
      - SD
      - XD

    system_specific:

      SG183:
        mtx_tags_downlink:
          - [DR, SG183SDL]

      SG184:
        mtx_tags_downlink:
          - [DR, SG184SDL]

      SG185:
        mtx_tags_downlink:
          - [DR, SG185SDL]


  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 10.103.235.0/24
      - 10.104.213.0/24
      - 192.146.238.172
      - 192.146.238.242
      - 10.117.235.0/24
      - 10.121.235.0/24
      - 10.131.235.0/24  
      - 10.197.255.0/28
      - 10.141.209.0/28
      - 10.120.201.32/28

    services:
      - qradio_tcp
      - qradio_http
      - qmr_http
      - mc_http
      - spectrum_http

  specnet:
    config: HAWK_2C
    tags:
      - SD
      - SU
      - XD

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p2_1 
      downlink_config: null

    autoconf:
      reference_attenuation_adjustment: 0
      inputFrequency: 1351
      inputFrequencyOffset: 2
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: x_rhcp

  qradio:
    tags:
      - SD
      - SU
      - XD
