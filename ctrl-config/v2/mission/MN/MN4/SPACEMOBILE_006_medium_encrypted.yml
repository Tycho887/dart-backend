acu_config: SPACEMOBILE_006
config: SPACEMOBILE
services:
  proxy:
    services:
    - qradio_tcp
    tags:
    - SD
    - SU
    whitelist:
    - 100.64.31.0/24
    - 100.64.80.0/26
    - 192.146.238.242
  qfep:
    config: default
    tags:
    - SD
    - SU
    tlm_record: false
  qradio:
    config: SPACEMOBILE_006_MediumRate_encrypted
    tags:
    - SD
    - SU
  specnet:
    autoconf:
      reference_attenuation_adjustment: 0
    tags:
    - SD
    - SU
    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1 
      downlink_config: s_band_downlink_p1_1
