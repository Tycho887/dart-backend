config: HAWK_2A
acu_config: HAWK_5AX

services:

  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 10.103.235.0/24
      - 10.104.213.0/24
      - 192.146.238.172
      - 192.146.238.242
      - 192.146.238.237
      - 10.117.235.0/24
      - 10.121.235.0/24
      - 10.131.235.0/24
      - 10.197.255.0/28
      - 10.141.209.0/28
      - 10.120.201.32/28
  

    services:
      - qradio_tcp
      - qradio_http
      - qmr_http
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU
      - XD

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: null

    autoconf:
      reference_attenuation_adjustment: -3
      inputFrequency: 1339
      inputFrequencyOffset: 2
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: x_rhcp

  wb_specnet:
    config: HAWK_2A
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1100
      rf0StreamOffset: -25
      rf0StreamBW: 200
      inputSpectralInversion: True

  qradio:
    config: HAWK_2AX
    tags:
      - SD
      - SU
      - XD
  
  qfep:
    tags:
      - SD
      - SU
      - XD

    config: default

  qrx:
    config: HAWK_DVBS2
    tags:
      - XD

  qmr:
    tags:
      - XD

    config: HAWK_DVBS2

  qdra-inst1:
    config: HAWK
    stream_server: hawk_9a
    tags:
      - XD
