config: CAPELLA_2


services:

  custom_backend:

    tags:
      - SD
      - XD

    system_specific:

      AT1:
        mtx_tags_downlink:
          - [DR, 1SDL]

      AT2:
        mtx_tags_downlink:
          - [DR, 2SDL]

      SG183:
        mtx_tags_downlink:
          - [DR, SG183SDL]

      SG184:
        mtx_tags_downlink:
          - [DR, SG184SDL]

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 10.103.252.0/24
      - 10.104.212.0/24
      - 10.117.202.0/24
      - 10.131.202.0/24
      - 10.121.202.0/24
      - 10.124.202.0/24
      - 10.203.1.11
      - 192.146.238.242
      - 192.146.238.195


    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 2
      inputFrequency: 1076
      streamOffset: 1
      streamBandwidth: 2
      gainMode: 'Automatic'
      packetProtectionEnable: False
      spectral_class_dl: x_rhcp

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 250
      rf0OutGainMode: "Manual"
      rf0OutManualGain: 0

  qradio:
    tags:
      - SD
      - SU

  qfep:
    tags:
      - SD
      - SU

  qrx:
    tags:
      - XD

  qmr:
    tags:
      - XD

  qdra-inst1:
    stream_server: capella
    tags:
      - XD

  qdra-inst2:
    stream_server: capella
    tags:
      - XD
