config: GESAT_1
acu_config: GESAT_1

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.242 # ben-nix
      - 192.146.238.223 # mmy-nix
      - 172.31.244.44 # mep-nix
      - 172.31.246.23 # gve-nix
      - 172.31.233.17
      - 172.31.233.88
      - 172.31.244.25 # saa-nix IP
      - 100.64.70.0/24 # SDWAN IP-Range for Nano
      #- 100.64.70.64/26 # SDWAN IP range

    services:
      - qradio_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 1

  qradio:
    tags:
      - SD
      - SU

  qmr:
    tags:
      - XD

  wb_specnet:
    tags: 
      - XD

    autoconf:
      inputCenterFrequency: 1400
      rf0StreamOffset: 16.5
      rf0StreamBW: 70

  qrx:
    tags:
      - XD

  qdra-inst1:
    config: NANO_PROTOMETHEE
    tags:
      - XD

    record: 
      streams: [1]

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: gesat-ksat-post-pass-transfer
      profile: KNA

