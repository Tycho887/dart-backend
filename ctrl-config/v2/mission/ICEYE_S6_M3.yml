---
config: ICEYE
acu_config: ICEYE_S6

services:
  proxy:
    tags:
      - XD
      - SD
      - SU

    whitelist:
      - 10.100.4.1
      - 100.64.52.0/24
      - 192.146.238.242

    services:
      - ctx_tcp
      - qradio_http
      - qmr_http
      - spectrum_http
      - monitor_tcp
      - mc_http
      
  ctx:    
    tags:
      - SD
      - SU

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 0

      system_specific:
        JJ1:
          force_attenuation: 21

  qradio:
    tags:
      - SD
      - SU

    config: ICEYE_2086M9_32k_256k

  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/ICEYE

  qmr:
    tags:
      - XD

    config: ICEYE_X2_tcp

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1350
      rf0StreamOffset: 0
      rf0StreamBW: 280

  qrx:
    tags:
      - XD

    config: ICEYE_X2_tcp

  qdra-inst1:
    stream_server: iceye
    tags:
      - XD

    config: ICEYE_LR_tcp

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: iceye-ksat-raw-downlinks-production
      profile: iceye
      stream_raw: True
      prefix: DATA
      concurrency: 3
