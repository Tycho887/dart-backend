config: MUSAT
acu_config: MUSAT_2

services:

  custom_backend:
    tags:
      - SU
      - XD

    mtx_tags_downlink:
      - [DL, MUR1]

    system_specific:
      NZ3:
        mtx_tags_downlink:
          - [DR, MUR1]

      MN3:
        mtx_tags_downlink:
          - [DR, MUR1]

      MN4:
        mtx_tags_downlink:
          - [DR, MUR1]

      FA5:
        mtx_tags_downlink:
          - [DR, MUR1]

      PA35:
        mtx_tags_downlink:
          - [DR, MUR1]

      PA36:
        mtx_tags_downlink:
          - [DR, MUR1]

      MU1:
        mtx_tags_downlink:
          - [DR, MUR1]

      MU2:
        mtx_tags_downlink:
          - [DR, MUR1]

      MU3:
        mtx_tags_downlink:
          - [DR, MUR1]

    mtx_tags_uplink: [MUT1, U]

  proxy:
    tags:
      - XD

    whitelist:
      - 172.31.244.0/24
      - 100.64.121.0/24
      - 172.31.244.44
      - 100.64.121.128/28
      - 100.64.121.248/29
      - 12.40.220.140
      - 52.183.85.92
      - 52.183.13.48
      - 10.10.0.101
      - 10.10.0.109
      - 100.64.115.0/26

    services:
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - XD
      - SU

    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the  particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can beoverridden in mission
      downlink_config: null

    autoconf:
      inputFrequency: 1437.5 #was 1432.5
      streamOffset: 0 # was 2.5
      txEnable: False
      spectral_class_dl: x_rhcp

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 5
      rf0StreamBW: 92

  qrx:
    tags:
      - XD

  qmr:
    tags:
      - XD


  qdra-inst1:
    stream_server: musat_cfe1
    tags:
      - XD
