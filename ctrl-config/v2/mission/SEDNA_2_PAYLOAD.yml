---
config: SEDNA
acu_config: SEDNA_2_PAYLOAD

services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.0/24
      - 172.31.244.0/24
      - 100.64.120.0/26 # SD-WAN
      
    services:
      - mc_http
      - qradio_tcp

  specnet:
    tags:
      - SD
      - SU
    
    autoconf: 
      reference_attenuation_adjustment: 0
      inputFrequency: 67 # + 2.5 = 69.5. Offset -0.5 from 70 MHz for this mission
      system_specific:
        MN4:
          # Account for S-band direct on MN4
          inputFrequency: 2197 # + 2.5 = 2199.5 MHz
          outputFrequency: 2101 # + 1.5 = 2102.5 MHz 

  qradio:
    tags:
      - SD
      - SU

    config: SEDNA_512kbps

  qfep:
    tags:
      - SD
      - SU

    config: SEDNA

    transfer:
      backend: ftp3
      home: /customers/FTP/SPACEQUEST

