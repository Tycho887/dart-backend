---
config: FIREFLY_1
acu_config: FFLY_2

services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.111.0/24
      - 192.146.238.242
      - 172.31.244.0/24

    services:
      - qradio_tcp
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU
    
    autoconf: 
      enabled: True
      reference_attenuation_adjustment: 2
      system_bandwidth: '22.0'
      streamBandwidth: 7.5
        
  qradio:
    tags:
      - SD
      - SU

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1150
      rf0StreamOffset: 0
      rf0StreamBW: 320

  qrx: 
    config: FIREFLY_2_AKASH
    tags: 
      - XD

  qdra-inst1:
    config: PIXXEL
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: p-datahub-ksat-s3-01
      profile: pixxelspace_datahub
      prefix: DATA


