---
config: TYVAK_0151
customer: TYVAK
constellation: TYVAK
acu_config: TYVAK_0151

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.168.37.0/24
      - 10.103.222.0/24
      - 192.146.238.172

    services:
      - qradio_tcp
      - qradio_http

  specnet:
    config: TYVAK_0151
    #no need to switch to _backup for specnet config
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -1
      inputFrequency: 68.5
      streamOffset: 1.5
      streamBandwidth: 3
      packetProtectionEnable: False
      spectral_class_dl: s_rhcp
      spectral_class_ul: s_rhcp

  qradio:
    #config: TYVAK_0151_backup
    tags:
      - SD
      - SU

  qfep:
    #config: TYVAK_0151_backup
    tags:
      - SD
      - SU

    transfer_staging:
      backend: ftp3
      home: /customers/FTP/TYVAK
      qfte: True
