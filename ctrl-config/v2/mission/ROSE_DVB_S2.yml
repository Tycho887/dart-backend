---
config: ROSE
acu_config: ROSE
customer: AEROSPACELAB_SA
constellation: AEROSPACELAB_SA

services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.53.0/24
      - 10.1.100.0/24
      - 192.146.238.172
      - 192.146.238.220
      - 192.146.238.223

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -6
      streamBandwidth: 7
      streamOffset: 3.5
      inputFrequency: 66.5
      system_bandwidth: "22.0"

  qradio:
    config: GREGOIRE_V2
    tags:
      - SD
      - SU

  qfep:
    tags:
      - SD
      - SU

  qrx:
    config: GREGOIRE_DVBS2
    tags:
      - XD
  
  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200 
      rf0StreamBW: 60
      rf0StreamOffset: 30

  qdra-inst1:
    config: GREGOIRE_DVBS2
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: ksat
      profile: AEROSPACELAB
      prefix: ROSE
      stream_raw: True
      s3_endpoint_url: https://s3.aerospacelab.com/ksat


