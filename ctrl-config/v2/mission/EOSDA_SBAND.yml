  qrx:
    tags:
      - XD

  qdra-inst1:
    config: DFA_SA_XA
    tags:
      - XD
    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: satellite-eossat-raw-euc1
      profile: EOSDA
      extension: .cadu
      post_transfer_delete: True
      
