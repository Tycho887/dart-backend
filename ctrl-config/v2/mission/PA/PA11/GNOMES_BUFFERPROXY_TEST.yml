---
config: GNOMES_1
acu_config: GNOMES_1

services:
  tracking_test:

    az_median_threshold: 180.0
    alt_median_threshold: 90.0

    tags:
      - tracking_test

    functions:
      - program_track
      - hpa_level

  proxy:
    tags:
      - SD
      - XD

    whitelist:
      - 100.64.12.0/24
      - 192.168.132.0/24
      - 192.146.238.242
      - 192.146.238.172
      - 192.146.238.223
      - 192.146.238.128/25

    services:
      - qradio_tcp
      - qradio_http
      - spectrum_http
      - qmr_http
      - mc_http

  specnet:
    tags:
      - SU
      - SD

    autoconf:
      reference_attenuation_adjustment: -6
      inputFrequency: 1307.5
      spectral_class_dl: x_rhcp
      txEnable: False

      system_specific:
        SG12:
          inputFrequency: 717.5 # +2.5
          outputFrequency: 2079.5 # +1.5
          force_attenuation: 8
          gainMode: 'Manual'
          manualGain: 60
        PA11:
          inputFrequency: 717.5 # +2.5
          outputFrequency: 2079.5 # +1.5
          force_attenuation: 1
          gainMode: 'Manual'
          manualGain: 60
        TR3:
          inputFrequency: 717.5 # +2.5
          force_attenuation: 16
        TR9:
          inputFrequency: 717.5 # +2.5
          force_attenuation: 22

  qradio:
    defaults:
      config: GNOMES_1_mode1
      
    tags:
      - SU
      - SD

  qfep:
    tags:
      - SU
      - SD
          
  qmr:
    tags:
      - XD

    config: noise_11Mbps

  wb_specnet:
    tags:
      - XD
 
    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 60
      rf0StreamBW: 25
      rf0InGainMode: "Manual"
      rf0InManualGain: 0
 
  qrx:
    tags:
      - XD

    config: noise_11Mbps

  qdra-inst1:
    tags:
      - XD

    config: GNOMES_bypassProxy

    stream_server: bct_planetiq
