---
config: GRUS_1X
customer: AXELSPACE
constellation: GRUS

services:

  custom_backend:

    system_specific:

      SG183:
        mtx_tags_downlink:
          - [DL, SG183XDR]

      SG184:
        mtx_tags_downlink:
          - [DL, SG184XDR]

      SG185:
        mtx_tags_downlink:
          - [DL, SG185XDR]
          
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 10.100.25.0/24
      - 10.100.23.0/24

    services:
      - qradio_tcp
      - qradio_http
      - ctx_tcp
      - mc_http

  specnet:
    tags:
      - SU
      - SD

    autoconf:
      reference_attenuation_adjustment: -3

  qradio:
    defaults:
      config: GRUS_1E
    tags:
      - SU
      - SD

  qfep:
    tags:
      - SU
      - SD

  qmr:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: prod-agss-ksat-downlink-us-east-1
      prefix: DATA
      profile: axelspace
      post_transfer_delete: False
