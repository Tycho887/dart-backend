config: AMS
acu_config: AMS

services:

  custom_backend:

    tags:
      - SD
      - XD

    system_specific:
      SG183:
        mtx_tags_downlink:
          - [DR, SG183SDL]

      SG184:
        mtx_tags_downlink:
          - [DR, SG184SDL]

      SG185:
        mtx_tags_downlink:
          - [DR, SG185SDL]


  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 192.146.238.195
      - 192.146.238.242
      - 192.146.238.237
      - 100.64.12.0/24

    services:
      - qradio_tcp
      - qradio_http
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU
      - XD

    autoconf:
      enabled: True
      reference_attenuation_adjustment: -1
      inputFrequency: 1260
      streamOffset: 2.5
      spectral_class_dl: x_rhcp

  qradio:
    tags:
      - SD
      - SU
      - XD

    defaults:
      config: AMS_mode1

  qfep:
    tags:
      - SD
      - SU
      - XD
