---
config: EWS
acu_config: ORCA_1

services:
  custom_backend:
    tags:
      - SD
      - XD

    system_specific:
      AT2:
        mtx_tags_downlink:
          - [DR, 2SDL]

      HA3:
        mtx_tags_downlink:
          - [DR, 3SDL]
          
      SG183:
        mtx_tags_downlink:
          - [DR, SG183SDL]

      SG184:
        mtx_tags_downlink:
          - [DR, SG184SDL]

      SG185:
        mtx_tags_downlink:
          - [DR, SG185SDL]

  proxy:
    tags:
      - SU
      - SD
      - XD

    whitelist:
      - 100.64.44.0/26
      - 192.146.238.0/24
      - 10.0.2.0/24

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU
      - XD

    autoconf:
      reference_attenuation_adjustment: -5
      inputFrequency: 1247.5
      spectral_class_dl: x_rhcp
      
  qradio:
    tags:
      - SD
      - SU
      - XD

    config: EWS_2048

  qfep:
    tags:
      - SD
      - SU
    
    config: EWS_2048

    transfer:
      backend: ftpSvalSat
      home: /data/customers/astraspace/TEST

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamBW: 3

  qrx:
    tags: 
      - XD

    config: EWS_1024    

  qmr:
    tags:
      - XD

    config: EWS_1024

  qdra-inst1:
    tags:
      - XD

    record:
      streams: [1]

    transfer:
      backend: ftpSvalSat
      home: /data/customers/astraspace/TEST
