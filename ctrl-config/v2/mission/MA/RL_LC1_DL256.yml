---
kind: minimal
config: RL_LC2_DL256
acu_config: F25

tags:
  - disable_acu

services:

  proxy:
    tags:
      - SD
      - SU

    whitelist:
      - 192.146.238.0/24
      - 10.103.236.0/24
      - 10.120.250.0/24
      - 10.121.250.0/24
      - 10.119.250.0/24
      - 10.124.250.0/24
      - 10.131.250.0/24
      - 10.134.250.0/24
      - 10.141.250.0/24
      - 100.64.20.0/24
      - 172.31.244.24/32
      - 192.146.238.233/32
      
    services:
      - acu_tcp
      - qradio_tcp
      - qradio_http
      - spectrum_http

  specnet:
#    defaults:
#      config: RL_F13   
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 0

      system_specific:
        LB1:
          inputFrequency: 2265
          streamOffset: 0 
          streamBandwidth: 2
          gainMode: 'Automatic'
          packetProtectionEnable: True
          spectral_class_dl: s_rhcp
          reference_attenuation_adjustment: 0

  qradio:
    tags:
      - SD
      - SU

    record: True
    transfer:
      recording_path: /home/rtlogic/electron/recordings
      backend: ftpSvalSat
      home: /data/customers/rocketlab

  photon:
    tags:
      - SD
      - SU

    transfer:
      recording_path: /home/rtlogic/electron/recordings
      backend: ftpSvalSat
      home: /data/customers/rocketlab

  electron:
    tags:
      - SD
      - SU

      
