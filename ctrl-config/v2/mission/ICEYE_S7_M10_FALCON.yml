---
config: ICEYE_X4
acu_config: ICEYE_S7

services:

  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 10.100.4.1
      - 100.64.52.0/24
      - 192.146.238.0/24
      
    services:
      - ctx_tcp
      - qradio_http
      - qmr_http
      - spectrum_http
      - monitor_tcp
      - mc_http

  ctx:    
    tags:
      - SD
      - SU
              
  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 0
      system_specific:
        JJ1:
          force_attenuation: 21

  qradio:
    tags:
      - SD
      - SU

    config: ICEYE_2088M3_128k

      
  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/ICEYE
      
  qmr:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps_tcp
  
  wb_specnet:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 320

  qrx:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps_tcp

  qdra-inst1:
    tags:
      - XD

    config: ICEYE_HR_tcp

    stream_server: iceye

    record: True 
    
  falcon:
      tags:
        - XD

      delivery_config:
        # Credential which has access to the delivery destination
        credentials_id: e966193f-41e8-4151-84ad-bd27a37cba91
        protocol: AWS_USER
        bucket: iceye-ksat-falcon-raw-downlinks-production
        bucket_region: eu-central-1
        target_dir: "DATA/{contact_id}/payload"
