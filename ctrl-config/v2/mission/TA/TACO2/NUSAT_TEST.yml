---
config: NUSAT_136_53msps_20rolloff

services:

  custom_backend:

    tags:
      - SU

    system_specific:
      TACO2:
        mtx_tags_uplink: [2WBU, U]

  proxy:
    tags:
      - SU
      - XD

    whitelist:
      - 10.143.209.0/28
      - 172.31.244.44

    services:
      - spectrum_http
      - monitor_tcp
      - mc_http
      - qradio_tcp
  
  specnet:
    tags:
      - SU
      - XD

    autoconf:
      inputFrequency: 1080
      inputFrequencyOffset: 2
      streamOffset: 2
      streamBandwidth: 0.889
      txEnable: False
      reference_attenuation_adjustment: 2
      outputFrequency: 69 #Tx freq 2062 MHz
      outputFrequencyOffset: 2.5
      spectral_class_dl: x_rhcp

  qradio:
    config: NUSAT_IDLE
    tags:
      - SU
      - XD
  
  wb_specnet:
    tags:
      - XD
  
    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: -20
      rf0StreamBW: 165
      rf1Enable: True
      rf1StreamOffset: 160
      rf1StreamBW: 165

  qrx:
    tags: 
      - XD
    


  qrx2:
    config: NUSAT_TEST_1_8 
    tags:
      - XD
    

  qdra-inst1:
    config: NUSAT
    stream_server: satellogic
    tags:
      - XD

