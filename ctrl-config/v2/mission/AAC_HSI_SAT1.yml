services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.195
      - 192.168.113.0/24
      - 10.202.1.0/24
      - 172.16.192.0/18
      - 118.39.27.155
      - 100.64.48.0/24 # Clyde SDWAN

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      # - monitor_tcp

  specnet:
