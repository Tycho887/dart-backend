      inputSpectralInversion: True
      rf0StreamOffset: -5
      rf0StreamBW: 100

  qrx: 
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True
  
    transfer:
      backend: ftp3
      home: /customers/FTP/CLYDESPACE

