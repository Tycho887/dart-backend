---
config: AQUA
acu_config: LONGLOOP_TEST


services:
  proxy:
    tags:
      - XD

    whitelist:
      - 10.0.10.0/24
      - 10.131.203.10
      - 192.146.238.0/24
      - 172.31.244.0/24
      - 172.31.244.194
      - 172.31.245.74 # Emil IP
      - 10.143.127.222 # KAT VM
      - 172.24.146.6 # Odin
      - 172.24.146.0/20 # Summer student windows IP range
      
    services:
      - qmr_http
      - mc_http
      - qradio_tcp
      - spectrum_http


  qmr:
    tags:
      - XD

  specnet:
    tags:
      - SD
      - SU

    autoconf: 
      txEnable: True 
      reference_attenuation_adjustment: -4

  qradio:
    config: longloop_AQUA_TEST
    tags:
      - SD
      - SU

  wb_specnet:
    tags: 
      - XD
    
    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: 10
      rf0StreamBW: 20

  qrx:
    tags: 
      - XD

    config: AQUA_KFORGE

  qdra-inst1:
    tags:
      - XD

    config: AQUA_KFORGE_TEST

    record: True
    
    aws_s3_transfer:
      backend: aws_s3
      bucket_name: kf-t1-aqua-ingest
      profile: kforge_new
      prefix: DATA

