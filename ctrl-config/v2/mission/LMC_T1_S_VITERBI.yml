---
config: LM_T1
acu_config: LM_T1

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 172.31.244.111 # hsc-nix
      - 100.64.72.12/29 # LM SD-WAN
      - 172.31.244.112 # ksatus-nix
      - 172.31.244.114 # gdv-nix

    

    services:
      - qradio_tcp
      - mc_http

  orbital:
    auto_configure:
      system_enabled: True
      s_tx_link_1_id: ttc_tx_link_1_id
      s_rx_link_1_id: ttc_rx_link_1_id
      x_rx_link_1_id: payload_rx_link_1_id
      x_rx_link_2_id: payload_rx_link_2_id

      commands:
        s_rx_frequency:
          mode: auto # Uses frequency from s_rx_link1_1_id @ spacecraft link
          frequency: null

        s_tx_frequency:
          mode: auto # Uses frequency from s_tx_link1_1_id @ spacecraft link
          frequency: null

        s_polarization:
          mode: auto # Uses polarization from s_Xx_link1_1_id @ spacecraft link. Almost all current lite antennas only support same pol at tx / rx, so this sets both.
          polarization: null

  specnet:
    tags:
      - SD
      - SU
    
    autoconf:
      enabled: True
      reference_attenuation_adjustment: -7


  qradio:
    config: LM_T1_VITERBI
    tags:
      - SD
      - SU





