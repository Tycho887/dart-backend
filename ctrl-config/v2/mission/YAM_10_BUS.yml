---
config: LOFT_LONGBOW
acu_config: YAM_10_BUS

services:
  ksat_acu_orbital:
    tags:
      - ksat_acu_orbital

    link_config:
      uplink_config: s_band_uplink_p2_1 # For setting UL Polarization

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.242
      - 100.64.22.0/24
      - 100.64.24.0/24
      - 172.31.245.74/23 #Emil for LEOP

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU
    
    link_config:
      uplink_config: s_band_uplink_p2_1
      downlink_config: s_band_downlink_p2_1

    autoconf:
      reference_attenuation_adjustment: -4

      spectral_class_dl: s_lhcp
      spectral_class_ul: s_lhcp

  qradio:
    tags:
      - SD
      - SU

    config: LOFT_LONGBOW_BUS

    link_config:
      # For dynamic doppler comp frequency
      uplink_config: s_band_uplink_p2_1

  qfep:
    tags:
      - SD
      - SU

    tlm_record: False

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: -33
      rf0StreamBW: 300
      inputSpectralInversion: True

  wb_specnet2:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: -33
      rf0StreamBW: 300
      inputSpectralInversion: True

  qmr:
    tags:
      - XD

  qrx:
    tags:
      - XD

  qrx2:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: yac-1-ksat-data-delivery-bucket-production
      inst_path: True
      concurrency: 3
      profile: loft_yac1
      prefix: DATA

  qdra-inst2:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: yac-1-ksat-data-delivery-bucket-production
      inst_path: True
      concurrency: 3
      profile: loft_yac1
      prefix: DATA


  

