---
config: ICEYE_X4
customer: ICEYE
constellation: ICEYE
acu_config: ICEYE_X20

services:

  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 10.100.4.1
      - 100.64.52.0/24
      - 192.146.238.242
      
    services:
      - ctx_tcp
      - qradio_http
      - qmr_http
      - spectrum_http
      - monitor_tcp
      - mc_http
        
  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 0
      system_specific:
        JJ1:
          force_attenuation: 21

  qradio:
    tags:
      - SD
      - SU

    defaults:
      config: ICEYE_X20
      
  qfep:
    tags:
      - SD
      - SU

    transfer:
      backend: ftp3
      home: /customers/FTP/ICEYE
      
  qmr:
    tags:
      - XD

    config: ICEYE_TCM_125Msps_tcp

    modulation_personality: TCM


  wb_specnet:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps

    autoconf:
      inputCenterFrequency: 1250 
      rf0StreamOffset: 12.5 
      rf0StreamBW: 320

  qrx:
    tags:
      - XD

    config: ICEYE_TCM_125Msps_tcp

  qdra-inst1:
    stream_server: iceye
    tags:
      - XD

    config: ICEYE_HR_tcp

    record: True        
    
    aws_s3_transfer:
      backend: aws_s3
      bucket_name: iceye-ksat-raw-downlinks-production
      profile: iceye
      stream_raw: True
      prefix: DATA
      concurrency: 3

  contec:
    tags:
      - contec
      
    reserve: True
    contec_satellite_id: 1044

  capricorn:
    
    tags:
      - capricorn
    
