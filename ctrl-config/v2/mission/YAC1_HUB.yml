---
config: LOFT_LONGBOW
acu_config: YAC1_HUB

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.242
      - 100.64.22.0/24
      - 100.64.24.0/24
      - 172.31.245.74/23 #Emil for LEOP

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -6

      spectral_class_ul: s_rhcp
      spectral_class_dl: s_rhcp

  qradio:
    tags:
      - SD
      - SU

    config: LOFT_LONGBOW_HUB

  qfep:
    tags:
      - SD
      - SU

    tlm_record: False

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: -33
      rf0StreamBW: 300
      inputSpectralInversion: True

  wb_specnet2:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200
      rf0StreamOffset: -33
      rf0StreamBW: 300
      inputSpectralInversion: True

  qmr:
    tags:
      - XD

  qrx:
    tags:
      - XD

  qrx2:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: yac-1-ksat-data-delivery-bucket-production
      inst_path: True
      concurrency: 3
      profile: loft_yac1
      prefix: DATA

  qdra-inst2:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: yac-1-ksat-data-delivery-bucket-production
      inst_path: True
      concurrency: 3
      profile: loft_yac1
      prefix: DATA
  

