config: SPIN_64kbps
acu_config: SPIN

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.45.0/24 # sdwan GOS, SPIN and Otter Path
      - 172.31.244.114 # guro ip

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 1
      inputFrequency: 68
      streamOffset: 2
      streamBandwidth: 4
      packetProtectionEnable: False
      spectral_class_dl: s_rhcp
      spectral_class_ul: s_rhcp

  qradio:
    tags:
      - SD
      - SU

