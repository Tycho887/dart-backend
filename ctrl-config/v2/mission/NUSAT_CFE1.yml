---
config: NUSAT
acu_config: NUSAT_X

services:

  custom_backend: #Only enabled on dedicated antennas SG222,SG223, TR15, TR16
    tags:
      - XD
      - SU
    
    mtx_tags_downlink: 
      - [DL, NU1D]

    mtx_tags_uplink: [NU1U, U] 
    
    system_specific: #Nusat CFE1 is behind alias NUSAT-RX2 and NU2 on SG. Long story.
      SG222: 
        mtx_tags_downlink: 
          - [DL, NUSAT-RX2]
          - [DL, NUSAT-AR80]
        
        mtx_tags_uplink: [NU2, U]

      SG223: 
        mtx_tags_downlink: 
          - [DL, NUSAT-RX2]
          - [DL, NUSAT-AR80]
        
        mtx_tags_uplink: [NU2, U]
    
    
  proxy:
    tags:
      - SU
      - XD

    whitelist:
      - 192.146.238.0/24
      - 172.31.246.10
      - 172.31.244.44
      - 10.103.254.0/24
      - 10.101.19.32/27
      - 10.103.214.0/24
      - 10.104.210.0/24
      - 10.103.221.0/24
      - 10.203.233.0/28
      - 10.121.204.0/24
      - 10.117.203.0/24
      - 10.131.204.0/27

    services:
      - spectrum_http
      - mc_http
      - monitor_tcp
      - qradio_tcp

