---
services:
  qrx:
    tags:
      - XD

    config: noise_750Mbps_tcp

  qrx2:
    tags:
      - XD

    config: noise_750Mbps_tcp

  qdra-inst1:
    tags:
      - XD

    config: LOFT_LONGBOW_200MB

    record: True

  qdra-inst2:
    tags:
      - XD

    config: LOFT_LONGBOW_200MB

    record: True

  falcon:
    tags:
      - XD

    recorders:
      - hypermatter_api: http://10.121.112.203:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst1/"
                delimiter: "_"

      - hypermatter_api: http://10.121.112.204:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst2/"
                delimiter: "_"

    delivery_config:
      protocol: AWS_ROLE
      credentials_uuid: 22029971-22e8-49f3-80ef-cf31d2a44e14
      role_arn: arn:aws:iam::025066254418:role/ksat-delivery
      bucket: loft-orbital-ksat-delivery
      bucket_region: us-west-2
      target_dir: "DATA/{contact_id}/payload"