---
services:
  qrx:
    tags:
      - XD

    config: noise_750Mbps

  qrx2:
    tags:
      - XD

    config: noise_750Mbps

  qdra-inst1:
    tags:
      - XD

    config: FALCON_TEST_200MB

    record: True

  qdra-inst2:
    tags:
      - XD

    config: FALCON_TEST_200MB

    record: True

  falcon:
    tags:
      - XD

    recorders:
      - hypermatter_api: http://10.121.112.203:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst1/"
                delimiter: "_"

      - hypermatter_api: http://10.121.112.204:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst2/"
                delimiter: "_"

    delivery_config:
      protocol: AZURE
      credentials_uuid: 65aafcd5-da51-4042-960f-aa7e97efb339
      container: test
      target_dir: "DATA/{contact_id}/payload"