---
config: STRIX_A
acu_config: STRIX_3
services:

  proxy:
    tags:
      - SD
      - SU

    whitelist:
      - 10.146.10.0/24
      - 10.146.20.0/24
      - 100.64.88.0/24  # sdwan
      - 172.31.244.114

    services:
      - ctx_tcp
      - mc_http
      - monitor_tcp  

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 0

  qradio:
    tags:
      - SD
      - SU
    
    defaults:
      config: STRIX_1

  qfep:
    tags:
      - SD
      - SU

  ctx:
    idtype: legacy
    tags:
      - SD
      - SU

  qmr:
    tags:
      - XD
    defaults: 
      config: STRIX_1_modcod13 

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 18
      inputSpectralInversion: True
      rf0StreamBW: 300
      rfInGainMode: "Manual"
      rf0InManualGain: 0

  qrx:
    config: STRIX_4
    tags:
      - XD

  qdra-inst1:
    stream_server: strix_2 
    tags:
      - XD

    record: true
    transfer:
      backend: ftpSvalSat
      home: /data/customers/synspective
