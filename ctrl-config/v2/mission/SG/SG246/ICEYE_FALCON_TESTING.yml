---
config: ICEYE_X4
acu_config: ICEYE_S7

services:
  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 320

  qrx:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps_tcp

  qdra-inst1:
    tags:
      - XD

    config: ICEYE_HR_SEGMENTED_tcp

    record: True

  falcon:
    tags:
      - XD
    
    recorders:
      - hypermatter_api: http://10.203.119.11:6000
        component_config:
          component: QDRA
          file_options_config:
            file_name:
              - ext: DAT
                enumerate: true # added at the end of the file name before the file extension
                sub_dir: "/qdra-inst1/"
                delimiter: "_"

    delivery_config:
      # Credential which has access to the delivery destination
      credentials_id: e966193f-41e8-4151-84ad-bd27a37cba91
      # Value between 0-10
      external_priority: 5
      # Upload files with a limit of 500Mb/s
      network_limit:
        value: 500
        unit: mbps
      # No retention
      retention_period: 0
      protocol: AWS_USER
      bucket: iceye-ksat-falcon-raw-downlinks-production
      bucket_region: eu-central-1
      target_dir: "DATA/{contact_id}/payload"
  
