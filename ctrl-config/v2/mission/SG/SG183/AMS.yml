acu_config: AMS
config: AMS
services:
  custom_backend:
    system_specific:
      SG183:
        mtx_tags_downlink:
        - - DL
          - SG183SDL
      SG184:
        mtx_tags_downlink:
        - - DR
          - SG184SDL
      SG185:
        mtx_tags_downlink:
        - - DR
          - SG185SDL
    tags:
    - SD
    - XD
  proxy:
    services:
    - qradio_tcp
    - qradio_http
    - mc_http
    - spectrum_http
    tags:
    - SU
    - SD
    - XD
    whitelist:
    - 192.146.238.195
    - 192.146.238.242
    - 192.146.238.237
    - 100.64.12.0/24
  qfep:
    tags:
    - SD
    - SU
    - XD
  qradio:
    defaults:
      config: AMS_mode1
    tags:
    - SD
    - SU
    - XD
  specnet:
    autoconf:
      enabled: True
      inputFrequency: 1260
      reference_attenuation_adjustment: -1
      spectral_class_dl: x_rhcp
      streamOffset: 2.5
    tags:
    - SD
    - SU
    - XD
