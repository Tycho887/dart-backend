acu_config: ORCA_1
config: EWS
services:
  custom_backend:
    system_specific:
      AT2:
        mtx_tags_downlink:
        - - DR
          - 2SDL
      HA3:
        mtx_tags_downlink:
        - - DR
          - 3SDL
      SG183:
        mtx_tags_downlink:
        - - DL
          - SG183SDL
      SG184:
        mtx_tags_downlink:
        - - DR
          - SG184SDL
      SG185:
        mtx_tags_downlink:
        - - DR
          - SG185SDL
    tags:
    - SD
    - XD
  proxy:
    services:
    - qradio_tcp
    - spectrum_http
    - mc_http
    tags:
    - SU
    - SD
    - XD
    whitelist:
    - 100.64.44.0/26
    - 192.146.238.0/24
    - 10.0.2.0/24
  qdra-inst1:
    record:
      streams:
      - 1
    tags:
    - XD
    transfer:
      backend: ftpSvalSat
      home: /data/customers/astraspace
  qfep:
    tags:
    - SD
    - SU
    transfer:
      backend: ftpSvalSat
      home: /data/customers/astraspace
  qmr:
    config: EWS_oqpsk
    tags:
    - XD
  qradio:
    config: EWS_1024
    tags:
    - SD
    - SU
    - XD
  qrx:
    config: EWS_oqpsk
    tags:
    - XD
  specnet:
    autoconf:
      inputFrequency: 1247.5
      reference_attenuation_adjustment: -5
      spectral_class_dl: x_rhcp
    tags:
    - SD
    - SU
    - XD
  wb_specnet:
    autoconf:
      inputCenterFrequency: 1250
      rf0StreamBW: 80
    tags:
    - XD
