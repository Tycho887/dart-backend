config: CO3D_2

services:

  cortex_crt1:
    document_id: 2
    menu_id: 3
    uplink:
      uplink_channel: 1
      sweep:
        blind_acq_timeout: 0
        idle_pattern_channel: 1
        sweep_duration: 30
    
  cortex_crt2:
    document_id: 2
    menu_id: 3
    uplink:
      uplink_channel: 1
      sweep:
        blind_acq_timeout: 0
        idle_pattern_channel: 1
        sweep_duration: 30

  proxy_co3d:
    # SG254 CRT1
    ttc_modem_name: crt1
    ttc_modem_ip: 10.203.116.75
    # crt2: ttc_modem_ip: 10.203.116.76

  uplink_rf_switch:
    input_port: 1
    output_port: 1

## Delayed modulation and IDLE for CO3D
#
# Airbus requests that modulation and IDLE is activated with a fixed offset due to their uplink acquisition sequence.
# This is solved by running a sweep (+/-1000Hz at 1Hz/s), the sweep is stopped by sweep_duration. The sweep range and rate is configured in the CRT documents.
# 
# Set sweep_duration to half of the requested modulation offset to ensure that carrier offset is 0Hz when modulation and IDLE are enabled.
# Note that timing is currently offset from scheduled AOS - awaiting integration towards HPA
