      - SU
      - SD

    whitelist:
      - 100.64.53.0/24
      - 10.1.100.0/24
      - 192.146.238.172
      - 192.146.238.220
      - 192.146.238.223

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

  qradio:
    config: GREGOIRE_V2
    tags:
      - SD
      - SU

  qfep:
    config: GREGOIRE_V2
    tags:
      - SD
      - SU

  qrx:
    config: GREGOIRE
    tags:
      - XD
  
  qmr:
    config: GREGOIRE
    tags:
      - XD
  
  wb_specnet:
