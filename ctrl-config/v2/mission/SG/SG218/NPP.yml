---
config: NPP_lite

services:
  proxy:
    tags:
      - SD

    services:
      - qradio_tcp
      - spectrum_http

    whitelist:
      - 100.64.21.0/24
      - 192.146.238.242

  specnet:
    tags:
      - SD
  
  qradio:
    tags:
      - SD
  
  qfep:
    tags:
      - SD

    tlm_record: True

    transfer:
      backend: ftp3
      home: /customers/FTP/JPSS_DEMO

  qmr:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    defaults:
      config: NPP_mod1

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: fes-jpss-us-east-1-prod-all-orbitdata-s3
      prefix: snpp/ksat-svalbard/DATA
      profile: jpss_demo_svalbard
      extension: .cadu
      post_transfer_delete: True
