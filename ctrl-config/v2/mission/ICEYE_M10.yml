---
## X-band only config
config: ICEYE_X4

services:
  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 10.100.4.1
      - 100.64.52.0/24
      - 192.146.238.242
      
    services:
      - monitor_tcp
      - qmr_http
      - spectrum_http
      - mc_http
      
  qmr:
    tags:
      - XD

    defaults:
      config: ICEYE_DVBS2_250Msps_tcp
  
  wb_specnet:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 12.5
      rf0StreamBW: 320

  qrx:
    tags:
      - XD

    config: ICEYE_DVBS2_250Msps_tcp

  qdra-inst1:
    tags:
      - XD

    stream_server: iceye

    config: ICEYE_HR_tcp

    record: True 

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: iceye-ksat-raw-downlinks-production
      profile: iceye
      stream_raw: True
      prefix: DATA

    
