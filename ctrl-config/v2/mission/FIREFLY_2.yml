---
config: FIREFLY_2
acu_config: FIREFLY_2

services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.111.0/24
      - 192.146.238.242
      - 172.31.244.0/24

    services:
      - qradio_tcp
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU
    
    link_config:  # Use this if not converted to 70 MHz
      mode: spacecraft  # Uses frequencies used in v2/spacecrafts for the particular spacecraft
      uplink_config: s_band_uplink_p1_1  # Default uplink config. Can be overridden in mission
      downlink_config: s_band_downlink_p1_1

    autoconf: 
      enabled: True
      reference_attenuation_adjustment: 2
      system_bandwidth: '22.0'
      streamBandwidth: 7.5
        
  qradio:
    tags:
      - SD
      - SU

