---
config: GRUS_1X
customer: AXELSPACE
acu_config: PYXIS

services:

  custom_backend:

    system_specific:

      SG183:
        mtx_tags_downlink:
          - [DL, SG183XDR]

      SG184:
        mtx_tags_downlink:
          - [DL, SG184XDR]

      SG185:
        mtx_tags_downlink:
          - [DL, SG185XDR]

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 10.100.25.0/24
      - 10.100.23.0/24
      - 10.9.40.0/22
      - 10.5.40.0/22


    services:
      - qradio_tcp
      - qradio_http
      - ctx_tcp
      - mc_http

  specnet:
    tags:
      - SU
      - SD

    autoconf:
      reference_attenuation_adjustment: -6

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: -25
      rf0StreamSampleRate: 260
      rf0OutGainMode: "Manual"
      rf0OutManualGain: 0

  qradio:
    defaults:
      config: PYXIS
        
    tags:
      - SU
      - SD

  qfep:
    tags:
      - SU
      - SD

  qrx:
    tags:
      - XD

  qmr:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: dev-al-pyxis-space-xdl-data
      prefix: DATA
      profile: axelspace_pyxis
    
      #transfer_staging:
      #  method: qfte
      #  stream_raw: False
      #  backend: ftpSvalSat
      #  home: /data/customers/axelspace
