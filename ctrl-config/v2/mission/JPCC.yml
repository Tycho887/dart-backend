---
config: JPCC
acu_config: JPCC
customer: AEROSPACELAB_SA
constellation: AEROSPACELAB_SA

services:
  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 100.64.53.0/24
      - 10.1.100.0/24
      - 192.146.238.172
      - 192.146.238.220
      - 192.146.238.223
      - 172.31.244.114 #guro ip

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http
      - monitor_tcp

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -3

  qradio:
    tags:
      - SD
      - SU

  qfep:
    tags:
      - SD
      - SU

  qrx:
    tags:
      - XD
  
  qmr:
    tags:
      - XD
  
  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1200 
      rf0StreamBW: 120
      rf0StreamOffset: 30

  qdra-inst1:
    config: JPCC
    tags:
      - XD

    record: 
      streams: [1]

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: ksat
      profile: AEROSPACELAB
      prefix: DATA
      stream_raw: True
      s3_endpoint_url: https://s3.aerospacelab.com/ksat


