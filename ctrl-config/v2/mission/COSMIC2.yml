---
config: COSMIC_2
acu_config: COSMIC_2

services:

  proxy:
    tags:
      - SD

    whitelist:
      - 192.146.238.0/24

    services:
      - qradio_tcp
      - mc_http

  specnet:
    tags:
      - SD

    autoconf:
      enabled: True
      reference_attenuation_adjustment: 10
      txEnabled: False
      packetProtectionEnable: True

      system_specific:
        MA6:
          inputFrequency: 2264
          outputFrequency: 2093.1

  qradio:
    tags:
      - SD
      - SU

  qfep:
    tags:
      - SD

  ctx:
    idtype: legacy
    id_flavour: legacy
    tags:
      - SD

    transfer:
      backend: ftp3
      home: /home/lite/COSMIC/

  ctx_legacy:
    tags:
      - SD
