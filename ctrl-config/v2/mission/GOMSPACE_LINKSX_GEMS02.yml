config: LINK_X_BASELINE
acu_config: GEMS02

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 172.31.244.25 # saa-nix
      - 100.64.90.0/24 # GomSpace sdwan
      - 100.64.166.0/24 # Weatherstream SDWAN

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: 3

  qradio:
    config: LINK_S_BASELINE_GEMS02
    tags:
      - SD
      - SU

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1300 # frequency is 8300MHz
      rf0StreamOffset: 50
      rf0StreamBW: 150
      rfInGainMode: "Manual"
      rf0InManualGain: 0

  qrx:
    tags:
      - XD

  
  qdra-inst1:
    config: GEMS02
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: hoop-oms-ksat-ingestion-us-east-1
      prefix: DATA
      profile: gems02
