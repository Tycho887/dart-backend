---
acu_config: GARAI_A
config: GARAI

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.242
      - 192.146.238.223
      - 192.146.238.220
      - 100.64.32.0/26 # Satlantis

    services:
      - qradio_tcp
      - spectrum_http
      - mc_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      enabled: True
      reference_attenuation_adjustment: -2
      streamBandwidth: 2.5

  qradio:
    tags:
      - SD
      - SU

  qmr:
    tags:
      - XD

    config: GARAI_A

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputSpectralInversion: True
      inputCenterFrequency: 1250
      rf0StreamOffset: 12
      rf0StreamBW: 320
      rf0InGainMode: "Manual"
      rf0InManualGain: 0

  qrx:
    tags:
      - XD

  qdra-inst1:
    tags:
      - XD

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: mcs-garai-a-storage
      profile: urdaneta
      prefix: garaia/x-band
