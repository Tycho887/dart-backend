---
## X-band only config
config: ICEYE

services:
  proxy:
    tags:
      - XD
      - SD

    whitelist:
      - 10.100.4.1
      - 100.64.52.0/24
      - 192.146.238.242
      
    services:
      - monitor_tcp
      - qmr_http
      - spectrum_http
      - mc_http

  qmr:
    tags:
      - XD

    config: ICEYE_X2_tcp

    defaults:
      qdra_port_inst1: 50023

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1350
      rf0StreamOffset: 0
      rf0StreamBW: 280

  qrx:
    tags:
      - XD

    config: ICEYE_X2_tcp

  qdra-inst1:
    stream_server: iceye
    tags:
      - XD

    config: ICEYE_LR_tcp

    record: True

    aws_s3_transfer:
      backend: aws_s3
      bucket_name: iceye-ksat-raw-downlinks-production
      profile: iceye
      stream_raw: True
      prefix: DATA
