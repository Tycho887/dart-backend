config: AGRISAT_SA
acu_config: AGRISAT

services:

  proxy:
    tags:
      - SU
      - SD

    whitelist:
      - 192.146.238.195
      - 100.64.34.0/24
  

    services:
      - qradio_tcp
      - mc_http
      - spectrum_http

  specnet:
    tags:
      - SD
      - SU

    autoconf:
      reference_attenuation_adjustment: -3

  qradio:
    tags:
      - SD
      - SU
   
  qmr:
    tags:
      - XD

    defaults:
      config: DFA_SA_XA

  wb_specnet:
    tags:
      - XD

    autoconf:
      inputCenterFrequency: 1250
      rf0StreamOffset: 50
      rf0StreamBW: 200
      rf0OutGainMode: "Manual"
      rf0OutManualGain: 0

  qrx:
    tags:
      - XD
    defaults:
      config: EOSDA_SA_XA_100
 
  qdra-inst1:
    tags:
      - XD
    defaults:    
      config: DFA_SA_XA
    record: True


