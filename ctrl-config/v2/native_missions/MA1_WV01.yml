---
executor: beehive

parameters:
  dg_antenna: ANT1HA
  dg_spacecraft: WV01

post:
  - type: rx_ebn0_above_threshold_in_carrier_lock
    name: rx_ebn0_above_threshold_in_carrier_lock_1
    group: eval
    handler: electron
    parameters:
      chain: payload
      instance: 1
      threshold: 13

  - type: rx_ebn0_above_threshold_in_carrier_lock
    name: rx_ebn0_above_threshold_in_carrier_lock_2
    group: eval
    handler: electron
    parameters:
      chain: payload
      instance: 2
      threshold: 13

  - type: qdra_mgr_ppr_check
    name: qdra_mgr_ppr_check
    group: eval
    handler: electron
    parameters: {}

  - type: qradio_spectralnet_if_gaps
    name: qradio_spectralnet_if_gaps
    group: eval
    handler: electron
    parameters: {}

  - type: qrx_spectralnet_if_gaps
    name: qrx_spectralnet_if_gaps_1
    group: eval
    handler: electron
    parameters:
      instance: 1

  - type: qrx_spectralnet_if_gaps
    name: qrx_spectralnet_if_gaps_2
    group: eval
    handler: electron
    parameters:
      instance: 2

tasks:
  - type: proxy
    name: proxy

    parameters:
      base_url: http://10.131.112.173:80
      services:
        - mc_http
        - monitor_tcp
        - dg_qfep_tcp

      whitelist:
        - 192.146.238.133
        - 192.146.238.105
        - 192.168.225.149
        - 10.131.112.171
        - 10.102.180.8
        - 10.1.32.0/21
        - 10.1.31.0/24
        - 10.1.30.0/24
        - 10.1.29.0/24
        - 100.64.94.0/23
        - 172.20.0.1

      open: -30
      close: 30
      kill: 5
      open_control: -5

  - type: monitor
    name: monitor

    parameters:
      base_url: http://10.131.112.172:80/scraper
      start_padding: 30
      end_padding: 30

  - type: nb_spectralnet
    name: nb_spectralnet

    parameters:
      base_url: http://10.131.127.30:80
      instance: 1
      config: WVIEW
      peer: 10.131.125.10
      init_teardown: 30

  - type: qradio
    name: dg_qradio

    parameters:
      base_url: http://10.131.112.170:8080
      instance: 1
      config: WVIEW
      peer: 10.131.125.30

      doppler_compensation:
        enabled: true
        frequency: 2085687500

      filerecorder:
        enabled: true

      recording_db:
        enabled: true
        base_url: http://10.131.127.214:9000

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.131.112.170:1234

          containers:
            - name: qradio

#  - type: dg_qfep
#    name: dg_qfep
#
