  - type: wb_spectralnet
    name: wb_spectralnet_pri_1

    parameters:
      base_url: http://10.131.127.61:80
      instance: 1
      config: WVIEW

  - type: qrx
    name: qrx_1

    parameters:
      config: WV01_RH
      base_url: http://10.131.127.83:8071
      instance: 1

      rx_out_host_1: 10.131.126.11
      rx_out_host_2: 10.131.126.11

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.131.127.83:1234

          containers:
            - name: qrx

  - type: wb_spectralnet
    name: wb_spectralnet_pri_2

    parameters:
      base_url: http://10.131.127.62:80
      instance: 2
      config: WVIEW

  - type: qrx
    name: qrx_2

    parameters:
      config: WV01_LH
      base_url: http://10.131.127.84:8071
      instance: 2

      rx_out_host_1: 10.131.126.11
      rx_out_host_2: 10.131.126.11

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.131.127.84:1234

          containers:
            - name: qrx

  - type: dg_qdra
    name: dg_qdra_ch1

    parameters:
      base_url: http://10.131.112.171:8081
      instance: 1
      config: qdra1

  - type: dg_qdra
    name: dg_qdra_ch2

    parameters:
      base_url: http://10.131.112.171:8082
      instance: 2
      config: qdra2

  - type: dg_qdra
    name: dg_qdra_ch3

    parameters:
      base_url: http://10.131.112.171:8083
      instance: 3
      config: qdra3

  - type: dg_qdra
    name: dg_qdra_ch4

    parameters:
      base_url: http://10.131.112.171:8084
      instance: 4
      config: qdra4

  - type: dg_qdra_manager
    name: dg_qdra_manager

    parameters:
      base_url: http://10.131.112.171:8080
      instance: 1
      config: default

      transfer_api:
        base_url: http://10.131.112.171:7007

      contact:
        data_mode: wv1_wv2_wv3
        channel_bit_rate: 200
        spacecraft_config: WV1
        processing_host_name: HA1
        strip_trailing_byte_count: 16
        dear_enable: true
        dear_asymalg_index: 2
        dear_pubkey_index: 1

      platform:
        platform: dockernode

        dockernode:
          base_url: http://10.131.112.171:1234

          containers:
            - name: dg_qdramgr
            - name: dg_qdra1
            - name: dg_qdra2
            - name: dg_qdra3
            - name: dg_qdra4

          fetch_ppr:
            - dg_qdra1
            - dg_qdra2
            - dg_qdra3
            - dg_qdra4

