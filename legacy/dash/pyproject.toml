[project]
name = "dash"
version = "0.1.0"
description = "Spacecraft telemetry enrichment and Doppler orbit-determination service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-kusto-data>=6.0.4",
    "azure-kusto-ingest>=6.0.4",
    "fastapi>=0.136.3",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "psycopg2>=2.9.12",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "satkit>=0.18.1",
    "scipy>=1.17.1",
    "sgp4>=2.25",
    "uvicorn>=0.49.0",
]
