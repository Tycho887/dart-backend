# Reproducible ANGLE-only example for AWESAT-1 S-band contacts at SG221.
#
# KOGS spacecraft UUID: 2cd1ce1c-3090-4a5f-b621-2e651c872245
# NORAD/catalog ID:     60543
# KOGS system UUID:     b1de0d11-e2c6-4c54-b319-01a3c1d92ea7
# KOGS station UUID:    381776b6-0867-4e9d-8589-0fcd76ee565f

[site]
# KOGS supplies the SG221 identity and WGS-84 coordinates. No reviewed
# pedestal offset or TLT calibration is available for this example, so those
# comments intentionally render as UNKNOWN with warnings.

[kogs]
spacecraft_id = "2cd1ce1c-3090-4a5f-b621-2e651c872245"
system_id = "b1de0d11-e2c6-4c54-b319-01a3c1d92ea7"
station_id = "381776b6-0867-4e9d-8589-0fcd76ee565f"

[spacecraft]
# KSAT permits a 5-digit catalog identifier as PARTICIPANT_2 when a COSPAR ID
# is unavailable from the configured metadata source.
identifier = "60543"
catalog_id = "60543"

[header]
summary = "AWESAT-1 S-band antenna pointing example"
comments = [
  "Example data only; confirm operational delivery metadata with the site owner",
]

[adx]
timestamp = "timestamp"
angle_timestamp = "timestamp"
contact_id = "contact_id"
# The TDM participant and filename use SG221, so compare it with the ADX
# antenna name instead of the internal KOGS system UUID.
station_id = "antenna_name"

[adx.angle_1]
column = "antenna1_position_azimuth"
unit = "deg"

[adx.angle_2]
column = "antenna1_position_elevation"
unit = "deg"

[angle]
receive_band = "S"
angle_type = "AZEL"
# The example windows below contain only ADX rows whose
# antenna1_tracking_status is Programtrack.
tracking_mode = "PROGRAM"
