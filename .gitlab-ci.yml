stages:
  - quality
  - test
  - integration

default:
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --frozen --extra api --extra orchestrator

quality:
  stage: quality
  script:
    - uv run ruff format --check src tests tools
    - uv run ruff check src tests tools
    - uv run ty check
    - uv run python tools/contracts/synchronize_openapi.py --check
    - uv run python tools/contracts/apply_schema_rules.py --check
    - uv run python tools/contracts/generate_projection.py --check
    - uv run python tools/contracts/check_openapi.py --check
    - uv run python tools/contracts/check_contracts.py --check
    - git diff --exit-code -- contracts src/dart/contract_projection.py

research_quality:
  stage: quality
  script:
    - uv sync --project research --frozen
    - uv run --project research ruff format --check research/src research/tests
    - uv run --project research ruff check research/src research/tests
    - uv run --project research ty check research/src

unit_tests:
  stage: test
  script:
    - uv run pytest -m "not live_integration" --cov=dart

research_tests:
  stage: test
  script:
    - uv sync --project research --frozen
    - uv run --project research pytest research/tests

live_integrations:
  stage: integration
  services:
    - name: timescale/timescaledb-ha:pg15-latest
      alias: timescaledb
  variables:
    POSTGRES_DB: dart_test
    POSTGRES_USER: dart_test
    POSTGRES_PASSWORD: dart_test
    DART_DATABASE_URL: postgresql://dart_test:dart_test@timescaledb:5432/dart_test
  script:
    - uv run pytest tests/test_timescale_jobs.py tests/test_adx_kogs_live.py
