stages:
  - quality
  - test
  - integration

default:
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --frozen --extra api --extra gateway --extra research

quality:
  stage: quality
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run ty check
    - uv run python scripts/synchronize_openapi_components.py --check
    - uv run python scripts/apply_contract_schema_rules.py --check
    - uv run python scripts/generate_wire_models.py --check
    - uv run python scripts/refresh_openapi_contracts.py --check
    - uv run python scripts/export_contracts.py --check
    - git diff --exit-code -- contracts src/dart/wire

unit_tests:
  stage: test
  script:
    - uv run pytest -m "not live_integration" --cov=dart

live_integrations:
  stage: integration
  services:
    - name: timescale/timescaledb-ha:pg15-latest
      alias: timescaledb
  variables:
    POSTGRES_DB: dart_test
    POSTGRES_USER: dart_test
    POSTGRES_PASSWORD: dart_test
    DART_DATABASE_URL: postgresql://dart_test:dart_test@timescaledb:5432/dart_test
  script:
    - uv run pytest tests/test_timescale_jobs.py tests/test_adx_kogs_live.py
