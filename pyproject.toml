[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dart-rf"
version = "0.2.0"
description = "Service-oriented passive-RF orbit determination"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "pydantic>=2.10",
    "satkit>=0.20.2",
    "sgp4>=2.25",
    "scipy>=1.15",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.34"]
orchestrator = [
    "azure-kusto-data>=6.0.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.35.0",
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "ty>=0.0.1a19",
]

[project.scripts]
dart-orchestrator = "dart.services.orchestrator.api:main"
dart-worker = "dart.services.orchestrator.worker:main"
dart-solver = "dart.services.solver.api:main"
dart-postprocessor = "dart.services.postprocessor.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dart"]

[tool.hatch.build.targets.wheel.force-include]
"deploy/database/001_processing_runs.sql" = "dart/services/orchestrator/schema.sql"
"contracts/openapi/orchestrator-v0.1.json" = "dart/openapi/orchestrator-v0.1.json"
"contracts/openapi/postprocessor-v0.1.json" = "dart/openapi/postprocessor-v0.1.json"
"contracts/openapi/solver-v0.1.json" = "dart/openapi/solver-v0.1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_integration: requires real external services and credentials; missing configuration is a failure",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "research",
    "skillset",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.src]
exclude = ["research"]

[tool.coverage.run]
source = ["dart"]
