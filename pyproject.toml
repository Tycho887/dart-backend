[project]
name = "dart"
version = "0.1.0"
description = "Orbit determination engine: Python loaders -> Rust solver -> CCSDS TDM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-kusto-data>=6.0.4",
    "msgpack>=1.2.1",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "satkit>=0.20.2",
    "uuid>=1.30",
]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pytest>=8",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/dart_solver/Cargo.toml"
module-name = "dart_solver"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

