[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dart-rf"
version = "0.2.0"
description = "Passive-RF orbit estimation and LEOP antenna acquisition"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "pydantic>=2.10",
    "satkit>=0.20.2",
    "sgp4>=2.25",
    "scipy>=1.15",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.34"]
gateway = [
    "azure-kusto-data>=6.0.4",
    "psycopg[binary]>=3.2",
]
plot = ["matplotlib>=3.10"]
research = ["polars>=1.31"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.35.0",
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "polars>=1.31",
    "ruff>=0.12",
    "ty>=0.0.1a19",
]

[project.scripts]
dart = "dart.cli:main"
dart-gateway = "dart.api.gateway:main"
dart-worker = "dart.gateway.worker_main:main"
dart-optimizer = "dart.api.optimizer:main"
dart-postprocessor = "dart.api.postprocessor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dart"]
exclude = [
    "src/dart/control/**",
    "src/dart/legacy/**",
    "src/dart/validation/**",
    "src/dart/estimation/batch.py",
    "src/dart/estimation/ukf.py",
    "src/dart/simulation.py",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations/001_processing_runs.sql" = "dart/gateway/schema.sql"
"contracts/openapi/orchestrator-v0.1.json" = "dart/wire/openapi/orchestrator-v0.1.json"
"contracts/openapi/postprocessor-v0.1.json" = "dart/wire/openapi/postprocessor-v0.1.json"
"contracts/openapi/solver-v0.1.json" = "dart/wire/openapi/solver-v0.1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_integration: requires real external services and credentials; missing configuration is a failure",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "legacy",
    "skillset",
    "src/dart/legacy",
    "src/dart/control",
    "src/dart/estimation/batch.py",
    "src/dart/estimation/ukf.py",
    "src/dart/simulation.py",
    "src/dart/validation",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.src]
exclude = [
    "legacy",
    "src/dart/control",
    "src/dart/estimation/batch.py",
    "src/dart/estimation/ukf.py",
    "src/dart/legacy",
    "src/dart/simulation.py",
    "src/dart/validation",
]

[tool.coverage.run]
source = ["dart"]
